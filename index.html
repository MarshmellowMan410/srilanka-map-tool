<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ශ්‍රී ලංකා සිතියම් අභ්‍යාසය</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Serif+Sinhala:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14181d; --panel: #1b2128; --panel-2: #232a33; --ink: #e9e7e2; --muted: #98a2ad;
  --brass: #e0ab4c; --brass-deep: #f3c063; --line: #303945;
  --hit-vivid: #16d16a; --hit-vivid-deep: #0ea855;
  --miss-vivid: #ff3b5c; --miss-vivid-deep: #e01e42;
  --sel: #38bdf8;
  --font-display: "Noto Serif Sinhala", "Iskoola Pota", Georgia, serif;
  --font-body: "Noto Sans Sinhala", "Iskoola Pota", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
button, input, select { font-family: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass-deep); outline-offset: 2px; }

/* Main 3-column app layout */
.app-container { display: flex; width: 100vw; height: 100vh; padding: 10px; gap: 10px; }
.sidebar-col { width: 320px; flex-shrink: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.content-area { flex: 1; min-width: 0; height: 100%; display: flex; gap: 10px; }

/* Left sidebar elements */
.brand-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: var(--brass-deep); margin: 0; }
.brand-sub { font-size: 0.68rem; color: var(--muted); margin: 2px 0 0 0; }
.nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.nav-btn { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 0.72rem; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-btn:hover { background: #2a3440; color: var(--brass-deep); }
.nav-btn.active { background: var(--brass); color: #14181d; font-weight: 700; border-color: var(--brass-deep); }
.nav-btn.generator { border-color: rgba(22, 209, 106, 0.4); color: #16d16a; }
.nav-btn.generator.active { background: #16d16a; color: #04180d; }
.nav-btn.analytics { border-color: rgba(56, 189, 248, 0.4); color: #38bdf8; }
.nav-btn.analytics.active { background: #38bdf8; color: #04202e; }

.settings-drawer { background: #171c22; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 8px; font-size: 0.72rem; display: flex; flex-direction: column; gap: 6px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; }
.switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw-slider { width: 28px; height: 16px; background: #3a4450; border-radius: 99px; position: relative; transition: .2s; }
.sw-slider::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: .2s; }
.switch input:checked + .sw-slider { background: #0ea855; }
.switch input:checked + .sw-slider::after { transform: translateX(12px); }

/* Quiz Box inside Left Column */
.quiz-card { background: #171c22; border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.status-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; }
.pills { display: flex; gap: 5px; }
.pill { background: var(--panel-2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; font-size: 0.72rem; }
.pill b { color: var(--brass-deep); }
.pname { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--brass-deep); text-align: center; margin: 4px 0; line-height: 1.25; }
.cat-tag { align-self: center; background: transparent; border: 1px solid var(--line); color: var(--muted); font-size: 0.68rem; padding: 2px 8px; border-radius: 99px; cursor: pointer; }
.cat-tag:hover, .cat-tag.on { border-color: var(--brass); color: var(--brass); background: rgba(224,171,76,0.1); }
.feedback { padding: 8px; border-radius: 6px; font-size: 0.78rem; text-align: center; font-weight: 600; display: none; }
.feedback.hit { background: rgba(22,209,106,0.2); border: 1px solid #16d16a; color: #a3f7c5; display: block; }
.feedback.miss { background: rgba(255,59,92,0.2); border: 1px solid #ff3b5c; color: #ff99aa; display: block; animation: missShake 0.4s ease-out; }
.next-btn { background: var(--brass); color: #14181d; border: none; border-radius: 8px; padding: 8px; font-size: 0.82rem; font-weight: 700; cursor: pointer; display: none; transition: background .15s; }
.next-btn:hover { background: var(--brass-deep); }

/* Center Map Container */
.map-shell { flex: 1; min-width: 0; height: 100%; position: relative; background: #fbf9f4; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: crosshair; }
.map-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: center center; }
.map-inner { position: relative; display: inline-block; line-height: 0; }
.map-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
.map-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

/* Floating Zoom Widget */
.zoom-widget { position: absolute; top: 12px; right: 12px; z-index: 30; background: rgba(27,33,40,0.9); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px; padding: 5px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
.zoom-btn { background: transparent; border: none; color: var(--brass-deep); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; transition: background .15s; }
.zoom-btn:hover { background: #2a3440; }
.zoom-badge { font-size: 0.65rem; font-weight: 700; color: var(--brass-deep); text-align: center; }

/* Right Place List Column */
.place-col { width: 290px; flex-shrink: 0; height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.pl-header { padding: 10px; border-bottom: 1px solid var(--line); background: #171c22; display: flex; flex-direction: column; gap: 6px; }
.pl-title { font-size: 0.82rem; font-weight: 700; color: var(--brass-deep); }
.pl-search, .pl-filter { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); padding: 5px 8px; font-size: 0.72rem; }
.pl-scroll { flex: 1; overflow-y: auto; padding: 6px; }
.pl-item { width: 100%; background: transparent; border: none; border-radius: 6px; padding: 5px 8px; text-align: left; color: var(--ink); font-size: 0.75rem; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: background .15s; }
.pl-item:hover { background: var(--panel-2); }
.pl-item.selected { background: rgba(56,189,248,0.18); border: 1px solid var(--sel); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.lv-new { background: #8d97a3; } .lv-learning { background: var(--brass); } .lv-weak { background: var(--miss-vivid); } .lv-mastered { background: var(--hit-vivid); }

/* Analyzing Column (Analytics view) */
.analyzing-col { width: 400px; flex-shrink: 0; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.an-title { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--brass-deep); margin: 0; }
.tiles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile-box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; }
.tile-val { font-size: 1.2rem; font-weight: 700; color: var(--brass-deep); font-family: var(--font-display); }
.tile-lbl { font-size: 0.65rem; color: var(--muted); }

/* Question Generator Custom Selector */
.generator-workspace { flex: 1; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.gen-header { padding: 12px; background: #171c22; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.gen-scroll { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.cat-card { background: #171c22; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cat-header { padding: 8px 10px; background: #232a33; display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; font-weight: 700; color: var(--brass-deep); }
.place-grid { padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
.place-label { display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: var(--panel-2); border-radius: 6px; font-size: 0.72rem; cursor: pointer; }

@keyframes missShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>
<body>
<div class="app-container">
  <!-- 1. LEFT SIDEBAR (No vertical scroll) -->
  <aside class="sidebar-col">
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h1 class="brand-title">ශ්‍රී ලංකා සිතියම් අභ්‍යාසය</h1>
          <p class="brand-sub">සිතියම මත ස්ථානය ක්ලික් කරන්න</p>
        </div>
        <button id="toggleSettingsBtn" style="background:#232a33; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:4px 7px; cursor:pointer;" title="සැකසුම්">⚙</button>
      </div>

      <!-- Settings Dropdown -->
      <div id="settingsDrawer" class="settings-drawer" style="display:none;">
        <div class="setting-row">
          <span>දත්ත සටහන් කිරීම</span>
          <label class="switch"><input type="checkbox" id="swTrack" checked><span class="sw-slider"></span></label>
        </div>
        <div class="setting-row">
          <span>කාල සීමාව (තත්.)</span>
          <div style="display:flex; gap:4px; align-items:center;">
            <select id="selSecs" style="background:#232a33; border:1px solid var(--line); color:var(--ink); border-radius:4px; font-size:0.65rem;">
              <option value="10">10s</option><option value="15" selected>15s</option><option value="20">20s</option><option value="30">30s</option>
            </select>
            <label class="switch"><input type="checkbox" id="swTimed"><span class="sw-slider"></span></label>
          </div>
        </div>
        <div class="setting-row">
          <span>සිතියමේ නම්</span>
          <label class="switch"><input type="checkbox" id="swNames" checked><span class="sw-slider"></span></label>
        </div>
      </div>

      <!-- Compact 2-column Nav Grid -->
      <div class="nav-grid" id="navGrid"></div>
    </div>

    <!-- Active Question / Result Card inside Left Sidebar -->
    <div id="quizCard" class="quiz-card" style="display:none;">
      <div class="status-row">
        <span style="color:var(--muted); font-size:0.68rem;">ලකුණු කරන්න</span>
        <div class="pills">
          <span class="pill">ලකුණු: <b id="scoreVal">0</b> / <span id="totalVal">0</span></span>
          <span class="pill" title="අඛණ්ඩව නිවැරදි පිළිතුරු">🔥 <b id="streakVal">0</b></span>
        </div>
      </div>
      <div id="riverHint" style="display:none; font-size:0.68rem; color:var(--brass); background:rgba(224,171,76,0.1); border:1px solid rgba(224,171,76,0.3); padding:4px 6px; border-radius:6px; text-align:center;">
        ගඟ මුහුදට මුණගැසෙන මෝය ළඟ ක්ලික් කරන්න
      </div>
      <div id="promptName" class="pname">—</div>
      <button type="button" id="catTag" class="cat-tag"><span id="catName"></span> (සියල්ල බලන්න)</button>
      <div id="feedbackBox" class="feedback"></div>
      <button type="button" id="nextBtn" class="next-btn">ඊළඟ ප්‍රශ්නය →</button>

      <!-- Summary box -->
      <div id="summaryBox" style="display:none; text-align:center;">
        <div style="font-size:0.75rem; color:var(--muted);">ඔබගේ ප්‍රතිඵලය</div>
        <div id="finalScoreText" style="font-size:1.8rem; font-weight:700; color:var(--brass-deep); font-family:var(--font-display);">0 / 0</div>
        <button type="button" id="restartBtn" class="next-btn" style="display:block; width:100%; margin-top:6px;">නැවත උත්සාහ කරන්න</button>
      </div>
    </div>
  </aside>

  <!-- 2. DYNAMIC CONTENT AREA -->
  <main class="content-area" id="contentArea">
    <!-- Map Center -->
    <div class="map-shell" id="mapShell">
      <div class="map-wrapper" id="mapWrapper">

let answerState = null, selectedKey = null, activeCatOnMap = null;
let customSelectedKeys = new Set(ALL.map(a => a.key));

/* DOM Elements */
const navGrid = document.getElementById('navGrid');
const mapShell = document.getElementById('mapShell');
const mapWrapper = document.getElementById('mapWrapper');
const mapInner = document.getElementById('mapInner');
const mapImg = document.getElementById('mapImg');
const mapSvg = document.getElementById('mapSvg');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const zoomResetBtn = document.getElementById('zoomResetBtn');
const zoomBadge = document.getElementById('zoomBadge');
const quizCard = document.getElementById('quizCard');
const scoreVal = document.getElementById('scoreVal');
const totalVal = document.getElementById('totalVal');
const streakVal = document.getElementById('streakVal');
const promptName = document.getElementById('promptName');
const catName = document.getElementById('catName');
const catTag = document.getElementById('catTag');
const riverHint = document.getElementById('riverHint');
const feedbackBox = document.getElementById('feedbackBox');
const nextBtn = document.getElementById('nextBtn');
const summaryBox = document.getElementById('summaryBox');
const finalScoreText = document.getElementById('finalScoreText');
const restartBtn = document.getElementById('restartBtn');
const contentArea = document.getElementById('contentArea');
const placeCol = document.getElementById('placeCol');
const plSearch = document.getElementById('plSearch');
const plFilter = document.getElementById('plFilter');
const plScroll = document.getElementById('plScroll');
const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
const settingsDrawer = document.getElementById('settingsDrawer');
const swNames = document.getElementById('swNames');
const swTrack = document.getElementById('swTrack');

toggleSettingsBtn.onclick = () => {
  settingsDrawer.style.display = settingsDrawer.style.display === 'none' ? 'flex' : 'none';
};

/* Zoom and Pan Functionality */
function updateTransform() {
  mapWrapper.style.transform = "scale(" + zoom + ") translate(" + (panX / zoom) + "px, " + (panY / zoom) + "px)";
  zoomBadge.textContent = Math.round(zoom * 100) + "%";
}
function setZoom(newZ) {
  zoom = Math.min(4, Math.max(0.9, newZ));
  if (zoom <= 1) { panX = 0; panY = 0; }
  updateTransform();
}
zoomInBtn.onclick = (e) => { e.stopPropagation(); setZoom(zoom + 0.3); };
zoomOutBtn.onclick = (e) => { e.stopPropagation(); setZoom(zoom - 0.3); };
zoomResetBtn.onclick = (e) => { e.stopPropagation(); setZoom(1); };

mapShell.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = -e.deltaY * 0.002;
  setZoom(zoom * (1 + delta));
}, { passive: false });

let isDragging = false, dragStart = { x: 0, y: 0, px: 0, py: 0 };
mapShell.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || zoom <= 1) return;
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY, px: panX, py: panY };
  mapShell.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = dragStart.px + (e.clientX - dragStart.x);
  panY = dragStart.py + (e.clientY - dragStart.y);
  updateTransform();
});
window.addEventListener('mouseup', () => {
  if (isDragging) { isDragging = false; mapShell.style.cursor = zoom > 1 ? 'grab' : 'crosshair'; }
});

/* Map Click for answering */
mapShell.addEventListener('click', (e) => {
  if (Math.abs(e.clientX - dragStart.x) > 5 || Math.abs(e.clientY - dragStart.y) > 5) return;
  if (!quizOrder.length || isLocked || currentIndex >= quizOrder.length) return;
  const rect = mapImg.getBoundingClientRect();
  const fx = (e.clientX - rect.left) / rect.width;
  const fy = (e.clientY - rect.top) / rect.height;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;
  answer(fx, fy);
});

/* Drawing SVG Map Overlay */
function redrawMap() {
  while (mapSvg.firstChild) mapSvg.removeChild(mapSvg.firstChild);
  const W = mapImg.clientWidth, H = mapImg.clientHeight;
  if (!W || !H) return;
  mapSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  // Rivers
  ALL.filter(o => o.type === 'river').forEach(r => {
    if (activeCatOnMap === 'rivers' || (activeCatOnMap === r.catId)) {
      const pts = r.points.map(p => (p.x * W).toFixed(1) + ',' + (p.y * H).toFixed(1)).join(' ');
      const p1 = document.createElementNS(NS, 'polyline');
      p1.setAttribute('points', pts); p1.setAttribute('fill', 'none'); p1.setAttribute('stroke', '#14181d');
      p1.setAttribute('stroke-width', '6'); mapSvg.appendChild(p1);
      const p2 = document.createElementNS(NS, 'polyline');
      p2.setAttribute('points', pts); p2.setAttribute('fill', 'none'); p2.setAttribute('stroke', '#ff9f1a');
      p2.setAttribute('stroke-width', '3'); p2.setAttribute('stroke-dasharray', '7 5'); mapSvg.appendChild(p2);
    }
  });

  // Target Circle & Line if answered
  if (answerState) {
    const tx = answerState.target.ax * W, ty = answerState.target.ay * H;
    const rr = (answerState.target.tolCm / PAGE_CM) * W;
    const c1 = document.createElementNS(NS, 'circle');
    c1.setAttribute('cx', tx); c1.setAttribute('cy', ty); c1.setAttribute('r', rr);
    c1.setAttribute('fill', 'rgba(22,209,106,0.2)'); c1.setAttribute('stroke', '#fff'); c1.setAttribute('stroke-width', '5');
    mapSvg.appendChild(c1);
    const c2 = document.createElementNS(NS, 'circle');
    c2.setAttribute('cx', tx); c2.setAttribute('cy', ty); c2.setAttribute('r', rr);
    c2.setAttribute('fill', 'none'); c2.setAttribute('stroke', answerState.correct ? '#16d16a' : '#ff3b5c'); c2.setAttribute('stroke-width', '3');
    mapSvg.appendChild(c2);

    if (answerState.click && !answerState.correct) {
      const cx = answerState.click.x * W, cy = answerState.click.y * H;
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', cx); l.setAttribute('y1', cy); l.setAttribute('x2', tx); l.setAttribute('y2', ty);
      l.setAttribute('stroke', '#ff1f45'); l.setAttribute('stroke-width', '3'); l.setAttribute('stroke-dasharray', '8 6');
      mapSvg.appendChild(l);
    }
  }

  // Markers
  let itemsToDraw = [];
  if (activeCatOnMap) itemsToDraw = POOL_BY_CAT[activeCatOnMap] || [];
  if (selectedKey) itemsToDraw = itemsToDraw.concat([BY_KEY[selectedKey]]);
  if (answerState) itemsToDraw = itemsToDraw.concat([answerState.target]);

  itemsToDraw.forEach(it => {
    if (!it) return;
    const x = it.ax * W, y = it.ay * H;
    const isTarget = answerState && answerState.target.key === it.key;
    const isSel = selectedKey === it.key;
    const col = isTarget ? '#16d16a' : isSel ? '#38bdf8' : '#e0ab4c';

    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', isTarget || isSel ? '7' : '5');
    dot.setAttribute('fill', col); dot.setAttribute('stroke', '#fff'); dot.setAttribute('stroke-width', '2');
    mapSvg.appendChild(dot);

    if (swNames.checked || isTarget || isSel) {
      const txt = document.createElementNS(NS, 'text');
      txt.setAttribute('x', x + 10); txt.setAttribute('y', y + 4);
      txt.setAttribute('fill', '#fff'); txt.setAttribute('font-size', '11'); txt.setAttribute('font-weight', '600');
      txt.textContent = it.name;
      mapSvg.appendChild(txt);
    }
  });
}
mapImg.onload = redrawMap;
swNames.onchange = redrawMap;

/* Quiz Engine */
function startQuizSession(items) {
  quizOrder = items.slice().sort(() => Math.random() - 0.5);
  currentIndex = 0; isLocked = false; score = 0; streak = 0; results = [];
  answerState = null; selectedKey = null; activeCatOnMap = null;
  quizCard.style.display = 'flex'; summaryBox.style.display = 'none';
  promptName.style.display = 'block'; nextBtn.style.display = 'none';
  totalVal.textContent = quizOrder.length;
  showQuestion();
}

function showQuestion() {
  if (currentIndex >= quizOrder.length) {
    // Show summary
    quizCard.style.display = 'flex';
    promptName.style.display = 'none';
    feedbackBox.style.display = 'none';
    nextBtn.style.display = 'none';
    summaryBox.style.display = 'block';
    finalScoreText.textContent = score + " / " + quizOrder.length;
    return;
  }
  const cur = quizOrder[currentIndex];
  promptName.textContent = cur.name;
  catName.textContent = cur.categoryLabel;
  riverHint.style.display = cur.type === 'river' ? 'block' : 'none';
  scoreVal.textContent = score;
  streakVal.textContent = streak;
  feedbackBox.style.display = 'none';
  nextBtn.style.display = 'none';
  isLocked = false;
  answerState = null;
  redrawMap();
}

function answer(fx, fy) {
  isLocked = true;
  const target = quizOrder[currentIndex];
  const distPx = Math.hypot((fx - target.ax) * PAGE_CM, (fy - target.ay) * PAGE_CM);
  const correct = distPx <= target.tolCm;
  const distCm = Number(distPx.toFixed(2));
  if (correct) { score++; streak++; } else { streak = 0; }
  answerState = { target, correct, click: { x: fx, y: fy } };
  feedbackBox.textContent = correct ? "✓ නිවැරදියි! (" + distCm + " cm)" : "✗ වැරදියි (" + distCm + " cm ඈත)";
  feedbackBox.className = "feedback " + (correct ? "hit" : "miss");
  feedbackBox.style.display = "block";
  nextBtn.style.display = "block";
  if (swTrack.checked) saveEvent(target.key, correct, distCm);
  redrawMap();
}

nextBtn.onclick = () => { currentIndex++; showQuestion(); };
restartBtn.onclick = () => { startQuizSession(quizOrder); };
catTag.onclick = () => {
  const cur = quizOrder[currentIndex];
  if (!cur) return;
  activeCatOnMap = activeCatOnMap === cur.catId ? null : cur.catId;
  redrawMap();
};

/* Build Navigation Buttons */
CATEGORIES.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (activeTab === 'cat:' + c.id ? ' active' : '');
  btn.textContent = c.label;
  btn.onclick = () => {
    activeTab = 'cat:' + c.id;
    updateTabs();
    startQuizSession(POOL_BY_CAT[c.id]);
  };
  navGrid.appendChild(btn);
});

// Generator Button
const genBtn = document.createElement('button');
genBtn.className = 'nav-btn generator';
genBtn.textContent = '✨ ප්‍රශ්න උත්පාදකය';
genBtn.onclick = () => { activeTab = 'gen'; updateTabs(); showGeneratorWorkspace(); };
navGrid.appendChild(genBtn);

// Analytics Button
const anBtn = document.createElement('button');
anBtn.className = 'nav-btn analytics';
anBtn.textContent = '📊 විශ්ලේෂණය';
anBtn.onclick = () => { activeTab = 'analytics'; updateTabs(); showAnalyticsLayout(); };
navGrid.appendChild(anBtn);

function updateTabs() {
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.remove('active');
    if (activeTab.startsWith('cat:') && b.textContent === (CATEGORIES.find(c => 'cat:' + c.id === activeTab)?.label)) b.classList.add('active');
    if (activeTab === 'gen' && b.classList.contains('generator')) b.classList.add('active');
    if (activeTab === 'analytics' && b.classList.contains('analytics')) b.classList.add('active');
  });
}

/* Place List Populate */
function populatePlaceList() {
  plFilter.innerHTML = '<option value="">සියලු ප්‍රවර්ග</option>' + CATEGORIES.map(c => '<option value="' + c.id + '">' + c.label + '</option>').join('');
  renderPlaces();
}
function renderPlaces() {
  plScroll.innerHTML = '';
  const q = plSearch.value.trim().toLowerCase();
  const cf = plFilter.value;
  CATEGORIES.forEach(c => {
    if (cf && c.id !== cf) return;
    const pool = (POOL_BY_CAT[c.id] || []).filter(it => !q || it.name.toLowerCase().includes(q) || (it.alt && it.alt.toLowerCase().includes(q)));
    if (!pool.length) return;

    const grp = document.createElement('div');
    grp.style.marginBottom = '6px';
    const hd = document.createElement('div');
    hd.style.fontSize = '0.72rem'; hd.style.fontWeight = '700'; hd.style.color = 'var(--brass)'; hd.style.padding = '4px 6px';
    hd.textContent = c.label + ' (' + pool.length + ')';
    grp.appendChild(hd);

    pool.forEach(it => {
      const b = document.createElement('button');
      b.className = 'pl-item' + (selectedKey === it.key ? ' selected' : '');
      b.innerHTML = '<span class="dot lv-new"></span><span>' + it.name + '</span>';
      b.onclick = () => { selectedKey = selectedKey === it.key ? null : it.key; redrawMap(); renderPlaces(); };
      grp.appendChild(b);
    });
    plScroll.appendChild(grp);
  });
}
plSearch.oninput = renderPlaces;
plFilter.onchange = renderPlaces;

/* Dynamic View Switchers */
function showNormalLayout() {
  contentArea.innerHTML = '';
  contentArea.appendChild(mapShell);
  contentArea.appendChild(placeCol);
  redrawMap();
}

/* 2. ANALYTICS VIEW: Layout [Menu] | [Analyzing Column (next to menu)] | [Map] */
function showAnalyticsLayout() {
  quizCard.style.display = 'none';
  contentArea.innerHTML = '';

  const anCol = document.createElement('div');
  anCol.className = 'analyzing-col';
  const totalAtt = events.length;
  const okAtt = events.filter(e => e.ok).length;
  const accPct = totalAtt ? Math.round(okAtt / totalAtt * 100) : 0;

  anCol.innerHTML = '<h2 class="an-title">ඔබේ දත්ත විශ්ලේෂණය</h2>' +
    '<div class="tiles-grid">' +
      '<div class="tile-box"><div class="tile-val">' + totalAtt + '</div><div class="tile-lbl">මුළු පිළිතුරු</div></div>' +
      '<div class="tile-box"><div class="tile-val">' + accPct + '%</div><div class="tile-lbl">නිවැරදි ප්‍රතිශතය</div></div>' +
    '</div>' +
    '<div style="font-size:0.75rem; color:var(--muted); line-height:1.6;">දත්ත බ්‍රවුසරයේ සුරැකී ඇත. වම්පසින් ප්‍රවර්ග තෝරා පිළිතුරු දීමෙන් ප්‍රගතිය ඉහළ නංවන්න.</div>' +
    '<button id="clearDataBtn" style="background:transparent; border:1px solid var(--miss-vivid); color:var(--miss-vivid); border-radius:6px; padding:6px; cursor:pointer; font-size:0.72rem;">සියලු දත්ත මකන්න</button>';

  contentArea.appendChild(anCol);
  contentArea.appendChild(mapShell);

  document.getElementById('clearDataBtn').onclick = () => {
    localStorage.removeItem(LS_EV); events = []; showAnalyticsLayout();
  };
  redrawMap();
}

/* 3. GENERATOR VIEW: Custom Place & Bulk Category Selector */
function showGeneratorWorkspace() {
  quizCard.style.display = 'none';
  contentArea.innerHTML = '';

  const ws = document.createElement('div');
  ws.className = 'generator-workspace';
  ws.innerHTML = '<div class="gen-header">' +
    '<div style="display:flex; justify-content:space-between; align-items:center;">' +
      '<h2 style="font-family:var(--font-display); font-size:0.95rem; font-weight:700; color:var(--brass-deep); margin:0;">ප්‍රශ්න උත්පාදකය — අභිරුචි ස්ථාන තෝරාගැනීම</h2>' +
      '<span id="selCountBadge" style="background:#0a2a1a; color:#16d16a; border:1px solid #16d16a; border-radius:99px; padding:2px 10px; font-size:0.72rem; font-weight:700;">' + customSelectedKeys.size + ' / ' + ALL.length + ' තෝරාගෙන ඇත</span>' +
    '</div>' +
    '<div style="display:flex; gap:8px; align-items:center;">' +
      '<button id="selAllBtn" style="background:#232a33; border:1px solid var(--line); color:var(--ink); padding:4px 8px; border-radius:6px; font-size:0.72rem; cursor:pointer;">සියල්ල තෝරන්න</button>' +
      '<button id="clearSelBtn" style="background:#232a33; border:1px solid var(--line); color:var(--ink); padding:4px 8px; border-radius:6px; font-size:0.72rem; cursor:pointer;">සියල්ල ඉවත් කරන්න</button>' +
      '<button id="startCustomQuizBtn" style="margin-left:auto; background:var(--hit-vivid); color:#04180d; border:none; padding:6px 14px; border-radius:6px; font-weight:700; font-size:0.75rem; cursor:pointer;">පරීක්ෂණය අරඹන්න ▶</button>' +
    '</div>' +
  '</div>' +
  '<div class="gen-scroll" id="genScroll"></div>';

  contentArea.appendChild(ws);

  const genScroll = document.getElementById('genScroll');
  CATEGORIES.forEach(c => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    const pool = POOL_BY_CAT[c.id] || [];
    const allChecked = pool.every(p => customSelectedKeys.has(p.key));

    const ch = document.createElement('div');
    ch.className = 'cat-header';
    ch.innerHTML = '<label style="display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" ' + (allChecked ? 'checked' : '') + '> <span>' + c.label + ' (' + pool.length + ')</span></label>';

    const chk = ch.querySelector('input');
    chk.onchange = (e) => {
      pool.forEach(p => { if (e.target.checked) customSelectedKeys.add(p.key); else customSelectedKeys.delete(p.key); });
      showGeneratorWorkspace();
    };
    card.appendChild(ch);

    const grid = document.createElement('div');
    grid.className = 'place-grid';
    pool.forEach(p => {
      const lbl = document.createElement('label');
      lbl.className = 'place-label';
      lbl.innerHTML = '<input type="checkbox" ' + (customSelectedKeys.has(p.key) ? 'checked' : '') + '> <span>' + p.name + '</span>';
      lbl.querySelector('input').onchange = (e) => {
        if (e.target.checked) customSelectedKeys.add(p.key); else customSelectedKeys.delete(p.key);
        document.getElementById('selCountBadge').textContent = customSelectedKeys.size + ' / ' + ALL.length + ' තෝරාගෙන ඇත';
      };
      grid.appendChild(lbl);
    });
    card.appendChild(grid);
    genScroll.appendChild(card);
  });

  document.getElementById('selAllBtn').onclick = () => { customSelectedKeys = new Set(ALL.map(a => a.key)); showGeneratorWorkspace(); };
  document.getElementById('clearSelBtn').onclick = () => { customSelectedKeys = new Set(); showGeneratorWorkspace(); };
  document.getElementById('startCustomQuizBtn').onclick = () => {
    const items = Array.from(customSelectedKeys).map(k => BY_KEY[k]).filter(Boolean);
    if (!items.length) return alert('කරුණාකර අවම වශයෙන් එක් ස්ථානයක්වත් තෝරන්න');
    showNormalLayout();
    startQuizSession(items);
  };
}

// Initial Setup
populatePlaceList();
startQuizSession(POOL_BY_CAT['forts']);
</script>
</body>
</html>

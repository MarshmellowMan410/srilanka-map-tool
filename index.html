<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ශ්‍රී ලංකා සිතියම් අභ්‍යාසය</title>
<style>
:root {
  --bg: #14181d; --panel: #1b2128; --panel-2: #232a33; --ink: #e9e7e2; --muted: #98a2ad;
  --brass: #e0ab4c; --brass-deep: #f3c063; --line: #303945;
  --hit-vivid: #16d16a; --hit-vivid-deep: #0ea855;
  --miss-vivid: #ff3b5c; --miss-vivid-deep: #e01e42;
  --sel: #38bdf8;
  --font-display: "Iskoola Pota", "Noto Serif Sinhala", Georgia, serif;
  --font-body: "Iskoola Pota", "Noto Sans Sinhala", "Segoe UI", system-ui, sans-serif;
  --split-h: 640px;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; padding: 14px; color: var(--ink);
  font-family: var(--font-body);
  background: radial-gradient(ellipse at top, #1a2028, var(--bg) 60%);
}
button, input, select { font-family: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, .switch input:focus-visible + .sw {
  outline: 2px solid var(--brass-deep); outline-offset: 2px;
}
.wrap { max-width: 1500px; margin: 0 auto; }

/* ---------- header / toolbar / tabs ---------- */
header.top { text-align: center; margin-bottom: 8px; }
header.top h1 { font-family: var(--font-display); font-size: 1.5rem; margin: 0; color: var(--brass-deep); }
header.top .sub { margin: 4px 0 0; font-size: .82rem; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: center; align-items: center; margin: 8px 0 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: .8rem; color: var(--ink);
}
.chip.off { border-color: var(--brass); }
.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 34px; height: 19px; border-radius: 999px; background: #3a4450; position: relative; transition: background .15s; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #cfd6dd; transition: transform .15s; }
.switch input:checked + .sw { background: var(--hit-vivid-deep); }
.switch input:checked + .sw::after { transform: translateX(15px); background: #fff; }
.sw-state { font-size: .72rem; color: var(--muted); min-width: 3.4em; }
.chip select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-size: .78rem; }
.chip select:disabled { opacity: .45; }
.seg { display: inline-flex; border: 1.5px solid var(--brass); border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; color: var(--brass); border: none; padding: 4px 12px; font-size: .78rem; cursor: pointer; }
.seg button.on { background: var(--brass); color: #241a05; font-weight: 700; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 4px 0 12px; }
.tab-btn {
  background: transparent; color: var(--brass); border: 1.5px solid var(--brass); border-radius: 999px;
  padding: 6px 14px; font-size: .84rem; cursor: pointer;
}
.tab-btn:hover { background: #e0ab4c22; }
.tab-btn.active { background: var(--brass); color: #241a05; font-weight: 700; }
.tab-btn.generator { border-color: var(--hit-vivid); color: var(--hit-vivid); }
.tab-btn.generator.active { background: var(--hit-vivid-deep); color: #04180d; }
.tab-btn.analytics { border-color: var(--sel); color: var(--sel); }
.tab-btn.analytics.active { background: var(--sel); color: #04202e; }

.panel { display: none; }
.panel.active { display: block; }
.empty-state { text-align: center; color: var(--muted); padding: 40px 10px; }

/* ---------- layout: quiz | map | place list ---------- */
.split { display: flex; flex-direction: column; gap: 14px; }
.col-quiz { order: 1; min-width: 0; min-height: 0; }
.col-map { order: 2; display: flex; min-width: 0; min-height: 0; }
.split.summary .col-map, .split.two .col-map { order: 1; }
.split.summary .col-quiz, .split.two .col-quiz { order: 2; }
.col-list { order: 3; display: flex; height: 420px; min-height: 0; }
.panel-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

.map-shell {
  flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative;
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fdfcf9;
  transition: box-shadow .2s, border-color .2s;
}
body.view-fit .map-shell { height: 64vh; }
body:not(.view-fit) .map-shell { max-height: 78vh; }
.map-frame { position: relative; flex: 1 1 auto; min-height: 0; overflow: auto; cursor: crosshair; line-height: 0; overscroll-behavior: contain; }
.map-frame.locked { cursor: default; }
.map-frame.fit { overflow: hidden; display: flex; align-items: center; justify-content: center; }
.map-inner { position: relative; width: 100%; line-height: 0; }
.map-frame.fit .map-inner { flex: none; }
.map-img { display: block; width: 100%; height: auto; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.map-frame.fit .map-img { height: 100%; }
.ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.map-shell.hit-state { border-color: var(--hit-vivid); box-shadow: 0 0 0 3px #16d16a77; }
.map-shell.miss-state { border-color: var(--miss-vivid); box-shadow: 0 0 0 4px #ff3b5cbb; }
.map-shell.flash { animation: flashRed .9s ease-out 1; }
@keyframes flashRed {
  0% { box-shadow: 0 0 0 5px #ff3b5c, 0 0 48px 14px #ff3b5ccc; }
  100% { box-shadow: 0 0 0 4px #ff3b5cbb, 0 0 0 0 #ff3b5c00; }
}
.pulse-ring { transform-box: fill-box; transform-origin: center; animation: pulseRing 1s ease-out 3 forwards; }
@keyframes pulseRing { 0% { transform: scale(.7); opacity: .95; } 100% { transform: scale(3); opacity: 0; } }
.lbl-text { font-family: var(--font-body); font-size: 12.5px; font-weight: 600; fill: #fff; }
.lbl-text.big { font-size: 14px; }

@media (min-width: 880px) {
  .split { display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: minmax(0, var(--split-h)) auto; }
  .col-quiz { grid-column: 1; grid-row: 1; overflow-y: auto; }
  .col-map { grid-column: 2; grid-row: 1; }
  .col-list { grid-column: 1 / -1; grid-row: 2; height: 360px; }
  body.view-fit .map-shell, body:not(.view-fit) .map-shell { height: 100%; max-height: none; }
}
@media (min-width: 1100px) {
  .split { grid-template-columns: 300px minmax(0, 1fr) 280px; grid-template-rows: minmax(0, var(--split-h)); }
  .col-list { grid-column: 3; grid-row: 1; height: auto; }
  .split.two { grid-template-columns: 400px minmax(0, 1fr); }
}

/* ---------- quiz panel ---------- */
.status-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.find-label { font-size: .72rem; color: var(--muted); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.score-pill { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .78rem; }
.score-pill b { color: var(--brass-deep); }
.no-track-tag { font-size: .72rem; color: var(--brass-deep); border: 1px dashed var(--brass); border-radius: 8px; padding: 4px 8px; margin-bottom: 8px; text-align: center; }
.timer { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
.timer-bar { flex: 1; height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.timer-bar i { display: block; height: 100%; width: 100%; background: var(--hit-vivid); transition: width .15s linear; }
.timer.low .timer-bar i { background: var(--miss-vivid); }
.timer-num { font-size: .8rem; min-width: 2.6em; text-align: right; }
.river-hint { font-size: .78rem; color: var(--brass-deep); background: #e0ab4c1a; border: 1px solid #e0ab4c55; border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; text-align: center; }
.prompt-block { text-align: center; margin: 6px 0 12px; }
.pname { display: block; font-family: var(--font-display); font-size: 1.6rem; color: var(--ink); line-height: 1.35; }
.cat-tag {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; background: transparent;
  border: 1px solid #e0ab4c77; color: var(--brass); font-size: .74rem; padding: 3px 10px; border-radius: 999px; cursor: pointer;
}
.cat-tag:hover, .cat-tag.on { background: #e0ab4c22; border-color: var(--brass); }
.cat-tag .cat-act { color: var(--muted); font-size: .68rem; }

.feedback { margin-top: 12px; font-size: .92rem; text-align: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 10px; }
.feedback:empty { display: none; }
.feedback.locked-hint { color: var(--brass-deep); border-color: var(--brass); }
.feedback.hit-text { background: #0c4a2b; border-color: var(--hit-vivid); color: #d6ffe8; font-weight: 700; box-shadow: 0 0 0 2px #16d16a55; }
.feedback.miss-text {
  background: #c4122f; border-color: #ff8aa0; color: #fff; font-weight: 700; font-size: 1rem;
  box-shadow: 0 0 0 3px #ff3b5c66, 0 6px 22px #ff3b5c66; animation: missShake .45s ease-out 1;
}
@keyframes missShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.controls { margin-top: 12px; text-align: center; }
.next-btn, .restart-btn, .mistakes-btn, .exit-btn, .gen-start-btn {
  border: none; border-radius: 8px; padding: 10px 18px; font-size: .92rem; cursor: pointer; font-weight: 700;
}
.next-btn, .restart-btn, .gen-start-btn { background: var(--brass); color: #241a05; }
.next-btn:hover, .restart-btn:hover, .gen-start-btn:hover { background: var(--brass-deep); }
.next-btn.nudge { animation: nudge .5s ease-out 1; }
@keyframes nudge { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.12); box-shadow: 0 0 0 4px #e0ab4c88; } }
.mistakes-btn { background: var(--miss-vivid-deep); color: #fff; }
.mistakes-btn:hover { background: var(--miss-vivid); }
.exit-btn { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
.exit-btn:hover { color: var(--ink); border-color: var(--muted); }

/* ---------- results (left column) ---------- */
.r-state .msg { text-align: center; color: var(--muted); font-size: .9rem; }
.r-state .big { text-align: center; font-family: var(--font-display); font-size: 2.3rem; color: var(--brass-deep); margin: 4px 0; }
.r-meta { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
.r-meta b { color: var(--ink); }
.r-note { font-size: .74rem; color: var(--muted); line-height: 1.6; text-align: center; margin: 4px 0 10px; }
.review-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 5px; }
.review-list li {
  display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: .82rem;
  padding: 7px 9px; border-radius: 7px; background: var(--panel-2); border-left: 4px solid var(--hit-vivid); cursor: pointer;
}
.review-list li:hover { filter: brightness(1.15); }
.review-list li.ok { color: var(--hit-vivid); }
.review-list li.bad { color: #ffd5dc; background: #3a0a14; border-left-color: var(--miss-vivid); font-weight: 600; }
.review-list li.bad .mark { color: var(--miss-vivid); font-weight: 800; }
.rname { color: var(--ink); }
.rcat { display: block; font-size: .68rem; color: var(--muted); font-weight: 400; }
.r-actions { display: flex; flex-direction: column; gap: 8px; }
.r-actions button { width: 100%; }

/* ---------- place list ---------- */
.pl-box { padding: 0; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.pl-head { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.pl-title { font-family: var(--font-display); color: var(--brass-deep); font-size: 1rem; }
.pl-search, .pl-filter { width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: .83rem; }
.pl-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .68rem; color: var(--muted); }
.pl-legend span { display: inline-flex; align-items: center; gap: 4px; }
.pl-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; overscroll-behavior: contain; }
.pl-grp-head { display: flex; align-items: center; gap: 4px; position: sticky; top: 0; z-index: 1; background: var(--panel); padding: 8px 0 4px; }
.pl-caret { background: none; border: 0; color: var(--muted); cursor: pointer; width: 22px; padding: 2px; font-size: .85rem; transition: transform .15s; }
.pl-grp.collapsed .pl-caret { transform: rotate(-90deg); }
.pl-grp.collapsed .pl-items { display: none; }
.pl-cat-btn { flex: 1; text-align: left; background: none; border: 1px solid transparent; color: var(--brass-deep); font-weight: 700; font-size: .82rem; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.pl-cat-btn .n { color: var(--muted); font-weight: 400; font-size: .7rem; margin-left: 4px; }
.pl-cat-btn:hover { background: #e0ab4c1a; }
.pl-cat-btn.on { background: #e0ab4c33; border-color: var(--brass); }
.pl-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font-size: .84rem; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.pl-item:hover { background: var(--panel-2); }
.pl-item.sel { background: #38bdf826; outline: 1px solid var(--sel); }
.pl-item .alt { display: block; font-size: .7rem; color: var(--muted); }
.pl-item .pm { margin-left: auto; font-size: .7rem; color: var(--miss-vivid); font-weight: 800; }
.pl-empty { color: var(--muted); font-size: .8rem; text-align: center; padding: 18px 0; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.lv-new { background: #7a8591; } .lv-learning { background: var(--brass); } .lv-weak { background: var(--miss-vivid); } .lv-mastered { background: var(--hit-vivid); }

/* ---------- generator setup ---------- */
.gen-setup { max-width: 560px; margin: 24px auto; text-align: center; }
.gen-setup p { color: var(--muted); font-size: .9rem; line-height: 1.8; }
.gen-setup input[type=number] { width: 70px; margin: 0 8px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px; text-align: center; font-size: .95rem; }
.gen-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.gen-start-btn:disabled { opacity: .4; cursor: not-allowed; }
.gen-start-btn.weak { background: transparent; color: var(--brass-deep); border: 2px solid var(--brass); }
.gen-start-btn.weak:hover:not(:disabled) { background: #e0ab4c22; }
.gen-note { font-size: .78rem; color: var(--muted); margin-top: 10px; min-height: 1.2em; }

/* ---------- analytics ---------- */
.an-box { padding: 14px; }
.an-title { font-family: var(--font-display); color: var(--brass-deep); font-size: 1.1rem; margin-bottom: 8px; }
.an-note { font-size: .78rem; border-radius: 8px; padding: 8px 10px; margin: 8px 0; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); line-height: 1.6; }
.an-note.warn { border-color: var(--brass); color: var(--brass-deep); }
.an-note.ok { border-color: var(--hit-vivid); color: var(--hit-vivid); }
.an-focus { display: block; width: 100%; margin: 8px 0; background: #38bdf822; color: var(--sel); border: 1px solid var(--sel); border-radius: 8px; padding: 6px 10px; font-size: .78rem; cursor: pointer; }
.an-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
.tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; }
.tile b { display: block; font-size: 1.3rem; color: var(--brass-deep); font-family: var(--font-display); }
.tile span { font-size: .7rem; color: var(--muted); }
.lv-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .76rem; color: var(--muted); margin-bottom: 8px; }
.lv-row span { display: inline-flex; align-items: center; gap: 5px; }
.lv-row b { color: var(--ink); }
.heat-legend { display: flex; align-items: center; gap: 8px; font-size: .7rem; color: var(--muted); margin: 6px 0 12px; }
.heat-legend i { flex: 1; max-width: 120px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, hsl(120, 85%, 45%), hsl(60, 85%, 45%), hsl(0, 85%, 45%)); }
.act-btn { font-size: .82rem; border: 1.5px solid var(--brass); background: transparent; color: var(--brass); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.act-btn:hover:not(:disabled) { background: #e0ab4c22; }
.act-btn.primary { background: var(--brass); color: #241a05; font-weight: 700; width: 100%; }
.act-btn.primary:hover:not(:disabled) { background: var(--brass-deep); }
.act-btn:disabled { opacity: .4; cursor: not-allowed; }
.act-btn.danger { border-color: var(--miss-vivid); color: var(--miss-vivid); }
.act-btn.danger.armed { background: var(--miss-vivid-deep); color: #fff; }
.an-sec { margin-top: 18px; }
.an-sec h3 { font-size: .88rem; color: var(--ink); margin: 0 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.an-muted { font-size: .78rem; color: var(--muted); line-height: 1.7; }
.bar-row, .wk-row, .cf-row { display: grid; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--ink); border-radius: 8px; padding: 6px; font-size: .82rem; cursor: pointer; }
.bar-row:hover, .wk-row:hover, .cf-row:hover { background: var(--panel-2); }
.bar-row.on { border-color: var(--sel); background: #38bdf81a; }
.bar-row { grid-template-columns: minmax(0, 1fr) 70px 56px; }
.bt { height: 10px; border-radius: 99px; background: #8a1730; overflow: hidden; }
.bt.none { background: var(--panel-2); }
.bt i { display: block; height: 100%; background: var(--hit-vivid); }
.bp { text-align: right; font-weight: 700; }
.bp small, .wp small, .wn small { display: block; font-weight: 400; color: var(--muted); font-size: .68rem; }
.wk-row { grid-template-columns: 14px minmax(0, 1fr) auto; }
.wp { text-align: right; font-weight: 800; color: var(--miss-vivid); }
.cf-row { grid-template-columns: minmax(0, 1fr) auto; line-height: 1.6; }
.cf-row em { font-style: normal; font-weight: 800; color: var(--miss-vivid); }
.chart { width: 100%; height: auto; }
.chart .gridl { stroke: #303945; stroke-width: 1; }
.chart .ax { fill: #98a2ad; font-size: 10px; }
.data-tools { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- reference + footer (unchanged) ---------- */
.ref-block { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.ref-block summary { cursor: pointer; color: var(--brass-deep); font-weight: 700; }
.ref-cat { margin-top: 12px; }
.ref-cat h3 { margin: 0 0 6px; font-size: .9rem; color: var(--hit-vivid); }
.ref-cat ul { margin: 0; padding-left: 18px; font-size: .84rem; line-height: 1.8; color: var(--ink); }
.ref-cat .meta { color: var(--muted); font-size: .76rem; }
.credit { text-align: center; color: var(--muted); font-size: .72rem; margin: 18px 0 6px; }

@media (max-width: 640px) {
  body { padding: 10px; }
  header.top h1 { font-size: 1.2rem; }
  .toolbar, .tabs { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding-bottom: 4px; scrollbar-width: none; }
  .toolbar::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }
  .chip, .tab-btn { flex: none; white-space: nowrap; }
  body.view-fit .map-shell { height: 64vh; height: clamp(340px, calc(100dvh - 330px), 72vh); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.ref-cat h3 .pending { color: var(--miss-vivid); font-size: .72rem; font-weight: 400; }
.ref-cat ul li span.alt { color: var(--muted); font-size: .78rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar">
    <header class="top">
      <h1>ශ්‍රී ලංකා සිතියම් අභ්‍යාසය</h1>
      <p class="sub" id="subLine">සිතියම මත ස්ථානය ක්ලික් කරන්න</p>

const DEFAULT_TOL_CM = 0.4;
const PROXIMITY_TOL_CM = 0.2; // generator-only: candidates this close to an already-picked point are treated as "the same place"
const PAGE_CM = 21;
const NS = 'http://www.w3.org/2000/svg';

/* ===================== helpers ===================== */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function catHasData(c) {
  return c.type === 'point' ? (c.places && c.places.length > 0) : (c.rivers && c.rivers.length > 0);
}
function pickAskedName(item) {
  if (!item.alt) return item.name;
  const r = Math.random();
  if (r < 0.34) return item.name;
  if (r < 0.67) return item.alt;
  return item.name + ' (' + item.alt + ')';
}
function cmDist(ax, ay, bx, by) {
  return Math.hypot((ax - bx) * PAGE_CM, (ay - by) * PAGE_CM);
}
function fullName(it) { return it.name + (it.alt ? ' (' + it.alt + ')' : ''); }

// the map image is decoded once and shared by every map on the page
const MAP_URL = (() => {
  try {
    const b64 = MAP_SRC.split(',')[1], bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([u8], { type: MAP_SRC.slice(5, MAP_SRC.indexOf(';')) }));
  } catch (e) { return MAP_SRC; }
})();

/* ===================== flattened data ===================== */
// every place/river gets a unique key (category:id) and a single anchor point (rivers = their mouth)
const ALL = [], BY_KEY = {}, POOL_BY_CAT = {};
CATEGORIES.forEach(c => {
  const pool = c.type === 'point' ? (c.places || []) : (c.rivers || []);
  POOL_BY_CAT[c.id] = [];
  pool.forEach(it => {
    const o = Object.assign({}, it, {
      type: c.type, catId: c.id, categoryLabel: c.label, tolCm: c.tolCm || DEFAULT_TOL_CM,
      key: c.id + ':' + it.id,
      ax: c.type === 'point' ? it.x : it.points[0].x,
      ay: c.type === 'point' ? it.y : it.points[0].y
    });
    ALL.push(o); BY_KEY[o.key] = o; POOL_BY_CAT[c.id].push(o);
  });
});

const Bus = {
  m: {},
  on(e, f) { (this.m[e] = this.m[e] || []).push(f); return () => { this.m[e] = (this.m[e] || []).filter(x => x !== f); }; },
  emit(e, a) { (this.m[e] || []).slice().forEach(f => { try { f(a); } catch (err) { console.error(err); } }); }
};

  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { storageOK = false; return fb; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { storageOK = false; }
}

const Settings = {
  d: (() => {
    const s = Object.assign({ track: true, view: 'scroll', timed: false, secs: 15, names: true }, lsGet(LS_SET, {}) || {});
    if (s.view !== 'fit') s.view = 'scroll';
    if ([10, 15, 20, 30].indexOf(Number(s.secs)) < 0) s.secs = 15;
    s.secs = Number(s.secs); s.track = !!s.track; s.timed = !!s.timed; s.names = !!s.names;
    return s;
  })(),
  get(k) { return this.d[k]; },
  set(k, v) { this.d[k] = v; lsSet(LS_SET, this.d); Bus.emit('settings', k); }
};

function levelInfo(key) {
  const s = Stats.get().byKey[key];
  if (!s) return { cls: 'lv-new', label: 'අලුත්', s: null };
  if (s.mastered) return { cls: 'lv-mastered', label: 'ප්‍රගුණයි', s };
  if (s.weak) return { cls: 'lv-weak', label: 'දුර්වල', s };
  return { cls: 'lv-learning', label: 'ඉගෙනගන්නා', s };
}

const Stats = {
  dirty: true, cache: null,
  get() { if (!this.cache || this.dirty) { this.cache = this.compute(); this.dirty = false; } return this.cache; },
  compute() {
    const byKey = {}, byCat = {}, sess = new Map();
    let att = 0, ok = 0, dsum = 0, dn = 0;
    Tracker.ev.forEach(e => {
      const it = BY_KEY[e.k]; if (!it) return;
      const s = byKey[e.k] || (byKey[e.k] = { key: e.k, att: 0, miss: 0, recent: [] });
      s.att++; if (!e.ok) s.miss++;
      s.recent.push(e.ok); if (s.recent.length > 5) s.recent.shift();
      if (typeof e.d === 'number') { dsum += e.d; dn++; }
      const c = byCat[it.catId] || (byCat[it.catId] = { id: it.catId, att: 0, miss: 0 });
      c.att++; if (!e.ok) c.miss++;
      att++; if (e.ok) ok++;
      if (e.s) {
        const q = sess.get(e.s) || { s: e.s, t: e.t, n: 0, ok: 0 };
        q.n++; q.ok += e.ok; if (e.t < q.t) q.t = e.t; sess.set(e.s, q);
      }
    });
    let masteredCount = 0; const weakList = [];
    Object.keys(byKey).forEach(k => {
      const s = byKey[k], last3 = s.recent.slice(-3);
      s.mastered = s.att >= 3 && last3.length === 3 && last3.every(v => v === 1);
      s.lastOk = s.recent[s.recent.length - 1] === 1;
      s.weak = !s.mastered && (s.recent.filter(v => !v).length / s.recent.length) >= 0.5;
      s.smooth = (s.miss + 0.5) / (s.att + 1);
      if (s.mastered) masteredCount++;
      if (s.miss > 0 && !s.mastered) weakList.push(s);
    });
    weakList.sort((a, b) => b.smooth - a.smooth || b.att - a.att);

    // "you clicked near X while looking for Y": a miss that landed closer to another place than to its target
    const conf = {};
    Tracker.ev.forEach(e => {
      if (e.ok || e.cx == null || e.cy == null) return;
      const t = BY_KEY[e.k]; if (!t) return;
      const dt = cmDist(e.cx, e.cy, t.ax, t.ay);
      let best = null, bd = Infinity;
      for (const o of ALL) {
        if (o.key === e.k) continue;
        const d = cmDist(e.cx, e.cy, o.ax, o.ay);
        if (d < bd) { bd = d; best = o; }
      }
      if (best && bd < 1.0 && bd < dt) { const id = e.k + '>' + best.key; conf[id] = (conf[id] || 0) + 1; }
    });
    const confusions = Object.keys(conf).map(id => { const p = id.split('>'); return { from: p[0], to: p[1], n: conf[id] }; })
      .filter(c => c.n >= 2).sort((a, b) => b.n - a.n).slice(0, 6);

    return {
      att, ok, avgD: dn ? dsum / dn : null, byKey, byCat, masteredCount, weakList, confusions,
      sessions: Array.from(sess.values()).sort((a, b) => a.t - b.t)
    };
  }
};

const MAX_EVENTS = 6000;
function validEv(e) { return e && typeof e.t === 'number' && typeof e.k === 'string' && BY_KEY[e.k] && (e.ok === 0 || e.ok === 1); }
function evId(e) { return e.t + '|' + e.k + '|' + (e.s || ''); }
const Tracker = {
  ev: (() => { const a = lsGet(LS_EV, []); return Array.isArray(a) ? a.filter(validEv) : []; })(),
  add(e) {
    this.ev.push(e);
    if (this.ev.length > MAX_EVENTS) this.ev.splice(0, this.ev.length - MAX_EVENTS);
    this.save();
  },
  save() { lsSet(LS_EV, this.ev); Stats.dirty = true; Bus.emit('tracker'); },
  clear() { this.ev = []; this.save(); },
  exportText() {
    return JSON.stringify({ app: 'sri-lanka-map-quiz', version: 1, exported: new Date().toISOString(), events: this.ev });
  },
  importText(text) {
    const o = JSON.parse(text), arr = Array.isArray(o) ? o : o.events;
    if (!Array.isArray(arr)) throw new Error('bad file');
    const good = arr.filter(validEv), seen = new Set(this.ev.map(evId));
    let added = 0;
    good.forEach(e => { const id = evId(e); if (!seen.has(id)) { seen.add(id); this.ev.push(e); added++; } });
    this.ev.sort((a, b) => a.t - b.t);
    if (this.ev.length > MAX_EVENTS) this.ev.splice(0, this.ev.length - MAX_EVENTS);
    this.save();
    return { added, total: good.length };
  }
};

/* ===================== question generators ===================== */
function sessionFromCategory(cat) { return shuffle(POOL_BY_CAT[cat.id]); }

// weighted-by-history category picks, with cross-category "too close = same place" dedup
function generateSession(n) {
  const available = CATEGORIES.filter(catHasData);
  const totalWeight = available.reduce((s, c) => s + c.weight, 0);
  const usedByCategory = {}, picks = [], pickedPoints = [];
  let guard = 0;
  const maxGuard = n * 150 + 400;
  while (picks.length < n && guard < maxGuard) {
    guard++;
    let r = Math.random() * totalWeight, chosen = null;
    for (const c of available) { r -= c.weight; if (r <= 0) { chosen = c; break; } }
    if (!chosen) chosen = available[available.length - 1];
    const pool = POOL_BY_CAT[chosen.id];
    if (!pool.length) continue;
    const usedSet = usedByCategory[chosen.id] || (usedByCategory[chosen.id] = new Set());
    if (usedSet.size >= pool.length) continue;
    let item, tries = 0;
    do { item = pool[Math.floor(Math.random() * pool.length)]; tries++; } while (usedSet.has(item.key) && tries < 50);
    if (usedSet.has(item.key)) continue;
    // rivers are scored at a single mouth-point too, so they share the same "too close" check
    if (pickedPoints.some(p => cmDist(p.x, p.y, item.ax, item.ay) < PROXIMITY_TOL_CM)) continue;
    usedSet.add(item.key);
    pickedPoints.push({ x: item.ax, y: item.ay });
    picks.push(item);
  }
  return shuffle(picks);
}

// practice session that favours the places the user keeps getting wrong (needs tracked data)
function weakSession(n) {
  const st = Stats.get();
  const pool = ALL.map(it => {
    const s = st.byKey[it.key];
    let w;
    if (!s) w = 0.3;                        // never asked: small chance, keeps some variety
    else if (s.mastered) w = 0.15;          // already solid
    else w = 0.5 + 6 * s.smooth + (s.lastOk ? 0 : 1.5);
    return { it, w };
  });
  const picks = [], pts = [];
  let guard = 0;
  while (picks.length < n && pool.length && guard++ < 3000) {
    const total = pool.reduce((s, p) => s + p.w, 0);
    let r = Math.random() * total, i = 0;
    for (; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) break; }
    if (i >= pool.length) i = pool.length - 1;
    const it = pool.splice(i, 1)[0].it;
    if (pts.some(p => cmDist(p.x, p.y, it.ax, it.ay) < PROXIMITY_TOL_CM)) continue;
    pts.push({ x: it.ax, y: it.ay });
    picks.push(it);
  }
  return shuffle(picks);
}

/* ===================== arrow labels on the map ===================== */
const LBL_COL = { neutral: '#f3c063', hit: '#16d16a', miss: '#ff3b5c', sel: '#38bdf8' };
const LBL_BG = { neutral: '#14181d', hit: '#0a2a1a', miss: '#3a0a14', sel: '#082a3a' };

function rectsHit(r, list, pad) {
  for (const o of list) {
    if (r.x < o.x + o.w + pad && r.x + r.w + pad > o.x && r.y < o.y + o.h + pad && r.y + r.h + pad > o.y) return true;
  }
  return false;
}
function inRect(x, y, r, pad) { return x > r.x - pad && x < r.x + r.w + pad && y > r.y - pad && y < r.y + r.h + pad; }

// items: [{x, y (px), text, color, big, noText, fill}]  -- every item gets a dot; labelled ones also get a text box + arrow
function drawLabels(svg, W, H, items, extra) {
  const gm = svgEl('g', { opacity: 0 }, svg);
  items.forEach(it => {
    if (it.noText) return;
    const t = svgEl('text', { class: 'lbl-text' + (it.big ? ' big' : '') }, gm);
    t.textContent = it.text;
    let w = 0; try { w = t.getComputedTextLength(); } catch (e) { /* ignore */ }
    if (!w) w = it.text.length * 7.5;
    it.w = Math.ceil(w) + 14; it.h = it.big ? 26 : 22;
  });
  gm.remove();

  const obst = items.map(it => ({ x: it.x - 8, y: it.y - 8, w: 16, h: 16 })).concat(extra || []);
  const labelled = items.filter(it => !it.noText);
  labelled.forEach(it => { it.crowd = items.filter(o => o !== it && Math.hypot(o.x - it.x, o.y - it.y) < 80).length; });
  labelled.sort((a, b) => ((b.big ? 1 : 0) - (a.big ? 1 : 0)) || (b.crowd - a.crowd));

  const angles = []; for (let a = 0; a < 360; a += 22.5) angles.push(a * Math.PI / 180);
  const dists = [26, 40, 58, 80, 108, 140];
  const placed = [];
  labelled.forEach(it => {
    let best = null, bestCost = Infinity;
    for (let pass = 0; pass < 2 && !best; pass++) {
      for (const d of dists) for (const a of angles) {
        const ux = Math.cos(a), uy = Math.sin(a);
        const ext = Math.min((it.w / 2) / Math.max(Math.abs(ux), 0.001), (it.h / 2) / Math.max(Math.abs(uy), 0.001));
        const cx = it.x + ux * (d + ext), cy = it.y + uy * (d + ext);
        const r = { x: cx - it.w / 2, y: cy - it.h / 2, w: it.w, h: it.h };
        if (r.x < 2 || r.y < 2 || r.x + r.w > W - 2 || r.y + r.h > H - 2) continue;
        let cost = d + Math.abs(uy) * 10;
        if (rectsHit(r, obst, 3)) { if (pass === 0) continue; cost += 600; }
        const samples = [];
        for (let k = 10; k < d; k += 6) samples.push([it.x + ux * k, it.y + uy * k]);
        for (const s of samples) for (const p of placed) if (inRect(s[0], s[1], p.r, 2)) { cost += 160; break; }
        for (const p of placed) for (const s of p.samples) if (inRect(s[0], s[1], r, 2)) { cost += 160; break; }
        if (cost < bestCost) { bestCost = cost; best = { r, ux, uy, d, samples }; }
      }
    }
    if (!best) {
      const r = { x: Math.min(Math.max(2, it.x + 24), Math.max(2, W - it.w - 2)), y: Math.min(Math.max(2, it.y - it.h / 2), Math.max(2, H - it.h - 2)), w: it.w, h: it.h };
      best = { r, ux: 1, uy: 0, d: 24, samples: [] };
    }
    placed.push(best); obst.push(best.r); it.pos = best;
  });

  // layers: arrows at the bottom, then the dots, then the text boxes on top so no label is ever covered by an arrow
  const gArr = svgEl('g', null, svg), gDot = svgEl('g', null, svg), gBox = svgEl('g', null, svg);
  items.slice().sort((a, b) => (a.big ? 1 : 0) - (b.big ? 1 : 0)).forEach(it => {
    const col = LBL_COL[it.color] || LBL_COL.neutral, bg = LBL_BG[it.color] || LBL_BG.neutral;
    const R = it.big ? 7.5 : 5.5;
    svgEl('circle', { cx: it.x, cy: it.y, r: R + 2.2, fill: '#14181d' }, gDot);
    svgEl('circle', { cx: it.x, cy: it.y, r: R, fill: it.fill || col, stroke: '#fff', 'stroke-width': 1.6 }, gDot);
    if (!it.pos) return;
    const r = it.pos.r, ux = it.pos.ux, uy = it.pos.uy, d = it.pos.d;
    const ex = it.x + ux * d, ey = it.y + uy * d;          // where the arrow leaves the text box
    const tipD = R + 3;                                     // arrow tip stops just outside the dot
    const tx = it.x + ux * tipD, ty = it.y + uy * tipD;
    const bx = tx + ux * 10, by = ty + uy * 10;             // centre of the arrowhead base
    const nx = -uy, ny = ux;
    const head = [tx + ',' + ty, (bx + nx * 5) + ',' + (by + ny * 5), (bx - nx * 5) + ',' + (by - ny * 5)].join(' ');
    svgEl('line', { x1: ex, y1: ey, x2: bx, y2: by, stroke: '#14181d', 'stroke-width': 5, 'stroke-linecap': 'round' }, gArr);
    svgEl('polygon', { points: head, fill: '#14181d', stroke: '#14181d', 'stroke-width': 3, 'stroke-linejoin': 'round' }, gArr);
    svgEl('line', { x1: ex, y1: ey, x2: bx, y2: by, stroke: col, 'stroke-width': 2.4, 'stroke-linecap': 'round' }, gArr);
    svgEl('polygon', { points: head, fill: col }, gArr);
    svgEl('rect', { x: r.x, y: r.y, width: r.w, height: r.h, rx: 5, fill: bg, stroke: col, 'stroke-width': it.big ? 2.4 : 1.6 }, gBox);
    const t = svgEl('text', { x: r.x + r.w / 2, y: r.y + r.h / 2 + 4.5, 'text-anchor': 'middle', class: 'lbl-text' + (it.big ? ' big' : '') }, gBox);
    t.textContent = it.text;
  });
}

function drawRiver(g, it, W, H, col) {
  const pts = it.points.map(p => (p.x * W).toFixed(1) + ',' + (p.y * H).toFixed(1)).join(' ');
  svgEl('polyline', { points: pts, fill: 'none', stroke: '#14181d', 'stroke-width': 6, 'stroke-opacity': .55, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  svgEl('polyline', { points: pts, fill: 'none', stroke: col, 'stroke-width': 3, 'stroke-dasharray': '8 5', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
}

function drawClickMarker(g, x, y, ok, pulse) {

/* ===================== MapView: image + pixel-space SVG overlay, scroll or fit ===================== */
function createMapView(host) {
  host.innerHTML = '<div class="map-shell"><div class="map-frame"><div class="map-inner">' +
    '<img class="map-img" alt="සිතියම" draggable="false"><svg class="ov" preserveAspectRatio="none"></svg></div></div></div>';
  const shell = host.querySelector('.map-shell'), frame = host.querySelector('.map-frame');
  const inner = host.querySelector('.map-inner'), img = host.querySelector('.map-img'), svg = host.querySelector('.ov');
  const mv = { shell, frame, inner, svg, painter: null, onClick: null };

  mv.size = () => ({ W: inner.clientWidth, H: inner.clientHeight });
  mv.redraw = function () {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const W = inner.clientWidth, H = inner.clientHeight;
    if (!W || !H) return;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    if (mv.painter) mv.painter(svg, W, H);
  };
  mv.layout = function () {
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const fit = Settings.get('view') === 'fit';
    frame.classList.toggle('fit', fit);
    if (fit && nw) {
      const fw = frame.clientWidth, fh = frame.clientHeight;
      if (fw > 0 && fh > 0) {
        const s = Math.min(fw / nw, fh / nh);
        inner.style.width = Math.floor(nw * s) + 'px';
        inner.style.height = Math.floor(nh * s) + 'px';
      }
    } else {
      inner.style.width = '100%';
      inner.style.height = '';
    }
    mv.redraw();
  };
  // scroll the (scrollable) map so the given fractional points are in view
  mv.reveal = function (pts) {
    if (frame.classList.contains('fit') || !pts.length) return;
    const W = inner.clientWidth, H = inner.clientHeight, fw = frame.clientWidth, fh = frame.clientHeight;
    const xs = pts.map(p => p.x * W), ys = pts.map(p => p.y * H);
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs), minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    const vt = frame.scrollTop, vl = frame.scrollLeft;
    if (minY > vt + 40 && maxY < vt + fh - 40 && minX > vl + 40 && maxX < vl + fw - 40) return;
    let cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    if (maxY - minY > fh - 90) cy = ys[ys.length - 1];
    frame.scrollTo({ left: Math.max(0, cx - fw / 2), top: Math.max(0, cy - fh / 2), behavior: 'smooth' });
  };

  frame.addEventListener('click', e => {
    if (!mv.onClick) return;
    const r = inner.getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;
    mv.onClick(fx, fy, e);
  });
  img.addEventListener('load', () => mv.layout());
  img.src = MAP_URL;
  if (img.complete && img.naturalWidth) mv.layout();
  const ro = new ResizeObserver(() => mv.layout());
  ro.observe(frame);
  const off = Bus.on('settings', k => { if (k === 'view') mv.layout(); else if (k === 'names') mv.redraw(); });
  mv.destroy = () => { ro.disconnect(); off(); };
  return mv;
}

      b.dataset.q = (it.name + ' ' + (it.alt || '')).toLowerCase();
      b.innerHTML = '<i class="dot lv-new"></i><span class="pn">' + esc(it.name) + (it.alt ? '<span class="alt">' + esc(it.alt) + '</span>' : '') + '</span><span class="pm"></span>';
      itemsEl.appendChild(b);
    });
    scroller.appendChild(g); groups.push(g);
  });
  const empty = document.createElement('div');
  empty.className = 'pl-empty'; empty.textContent = 'ගැලපෙන ස්ථාන නැත'; empty.style.display = 'none';
  scroller.appendChild(empty);

  function applyFilter() {
    const qv = search.value.trim().toLowerCase(), cv = filter.value;
    let any = false;
    groups.forEach(g => {
      let vis = 0;
      g.querySelectorAll('.pl-item').forEach(b => {
        const show = !qv || b.dataset.q.indexOf(qv) >= 0;
        b.style.display = show ? '' : 'none';
        if (show) vis++;
      });
      const catOk = !cv || g.dataset.cat === cv;
      g.style.display = (catOk && vis) ? '' : 'none';
      if (qv) g.classList.remove('collapsed');
      if (catOk && vis) any = true;
    });
    empty.style.display = any ? 'none' : '';
  }
  function refresh() {
    scroller.querySelectorAll('.pl-item').forEach(b => {
      const li = levelInfo(b.dataset.key);
      b.querySelector('.dot').className = 'dot ' + li.cls;
      const pm = b.querySelector('.pm');
      if (li.s && li.s.miss > 0) { pm.textContent = Math.round(li.s.miss / li.s.att * 100) + '%'; pm.title = 'වැරදි ' + li.s.miss + ' / ' + li.s.att; }
      else { pm.textContent = ''; pm.removeAttribute('title'); }
      b.title = li.label;
    });
  }
  scroller.addEventListener('click', e => {
    const item = e.target.closest('.pl-item');
    if (item) { api.onPick(item.dataset.key); return; }
    const cb = e.target.closest('.pl-cat-btn');
    if (cb) { api.onCat(cb.dataset.cat); return; }
    const car = e.target.closest('.pl-caret');
    if (car) car.closest('.pl-grp').classList.toggle('collapsed');
  });
  search.addEventListener('input', applyFilter);
  filter.addEventListener('change', applyFilter);
  const off = Bus.on('tracker', refresh);
  refresh();

  return {
    refresh,
    setSel(key) {
      scroller.querySelectorAll('.pl-item.sel').forEach(b => b.classList.remove('sel'));
      if (!key) return;
      const b = scroller.querySelector('.pl-item[data-key="' + key + '"]');
      if (!b) return;
      b.classList.add('sel');
      b.closest('.pl-grp').classList.remove('collapsed');
      // scroll only the list itself (scrollIntoView would also scroll the whole page)
      const sr = scroller.getBoundingClientRect(), br = b.getBoundingClientRect();
      if (br.top < sr.top + 40) scroller.scrollTo({ top: scroller.scrollTop + br.top - sr.top - 44, behavior: 'smooth' });
      else if (br.bottom > sr.bottom) scroller.scrollTo({ top: scroller.scrollTop + br.bottom - sr.bottom + 8, behavior: 'smooth' });
    },
    setCat(id) { scroller.querySelectorAll('.pl-cat-btn').forEach(b => b.classList.toggle('on', b.dataset.cat === id)); },
    destroy() { off(); }
  };
}

/* ===================== quiz engine ===================== */
function buildQuizEngine(mountEl, getSession, opts) {
  opts = opts || {};
  mountEl.appendChild(document.getElementById('quiz-template').content.cloneNode(true));
  const root = mountEl;
  const q = s => root.querySelector(s);
  const qState = q('.q-state'), rState = q('.r-state');
  const promptName = q('.prompt-name'), catTag = q('.cat-tag'), catNameEl = q('.cat-name');
  const scoreVal = q('.score-val'), totalVal = q('.total-val'), streakVal = q('.streak-val');
  const riverHint = q('.river-hint'), noTrackTag = q('.no-track-tag');
  const timerWrap = q('.timer'), timerBar = q('.timer-bar i'), timerNum = q('.timer-num');
  const feedback = q('.feedback'), nextBtn = q('.next-btn');
  const finalScore = q('.final-score'), finalTotal = q('.final-total');
  const rMeta = q('.r-meta'), rNote = q('.r-note'), reviewList = q('.review-list');
  const restartBtn = q('.restart-btn'), mistakesBtn = q('.mistakes-btn'), exitBtn = q('.exit-btn');

  const splitEl = q('.split');
  const mv = createMapView(q('.col-map'));
  const shell = mv.shell, mapFrame = mv.frame;

  let order = [], idx = 0, locked = false, results = [], currentAskedName = '';
  let sid = '', streak = 0, bestStreak = 0;
  let scene = { answer: null, showCat: null, sel: null, summary: false };
  let timerId = null, tLeft = 0, tTotal = 15;
  const cleanups = [];

  // while a question is waiting for an answer its target must never be revealed by the list / category views
  const blockedKey = () => (!locked && !scene.summary && idx < order.length) ? order[idx].key : null;
  function say(msg, cls) { feedback.textContent = msg; feedback.className = 'feedback ' + (cls || ''); }

  const pl = createPlaceList(q('.col-list'), { onPick: key => pickPlace(key), onCat: id => pickCategory(id) });

  function pickPlace(key) {
    if (key === blockedKey()) { say('ඇසූ ස්ථානය පිළිතුරු දුන් පසු සිතියමේ බලන්න', 'locked-hint'); return; }
    scene.sel = scene.sel === key ? null : key;
    pl.setSel(scene.sel);
    mv.redraw();
    if (scene.sel) { const it = BY_KEY[key]; mv.reveal([{ x: it.ax, y: it.ay }]); }
  }
  function pickCategory(id) {
    scene.showCat = scene.showCat === id ? null : id;
    pl.setCat(scene.showCat);
    const cur = order[idx];
    catTag.classList.toggle('on', !!(scene.showCat && cur && cur.catId === scene.showCat));
    mv.redraw();
    if (scene.showCat && blockedKey() && cur && cur.catId === id) say('ඇසූ ස්ථානය හැර අනෙක් ස්ථාන පෙන්වා ඇත', 'locked-hint');
  }
  catTag.addEventListener('click', () => { const cur = order[idx]; if (cur && !scene.summary) pickCategory(cur.catId); });

  /* ----- painting the overlay ----- */
  mv.painter = (svg, W, H) => {
    const A = scene.answer, blocked = blockedKey(), names = Settings.get('names');
    const gRiv = svgEl('g', null, svg), gTol = svgEl('g', null, svg), gLab = svgEl('g', null, svg), gMark = svgEl('g', null, svg);

    let list = [];
    if (scene.showCat) list = POOL_BY_CAT[scene.showCat].filter(o => o.key !== blocked).map(o => ({ it: o, color: 'neutral' }));
    else if (scene.summary) list = results.map(r => ({ it: r.item, color: r.correct ? 'hit' : 'miss' }));
    if (scene.sel && scene.sel !== blocked) {
      list = list.filter(l => l.it.key !== scene.sel);
      list.push({ it: BY_KEY[scene.sel], color: 'sel', big: true, pulse: true });
    }
    if (A) {
      list = list.filter(l => l.it.key !== A.target.key);
      list.push({ it: A.target, color: 'hit', big: true, answer: true });
    }

    list.forEach(l => {
      if (l.it.type !== 'river') return;
      const col = l.answer ? '#ff9f1a' : (l.color === 'hit' ? '#16d16a' : l.color === 'miss' ? '#ff3b5c' : '#ff9f1a');
      drawRiver(gRiv, l.it, W, H, col);
    });

    const extra = [];
    if (A) {
      const tx = A.target.ax * W, ty = A.target.ay * H, rr = (A.target.tolCm / PAGE_CM) * W;
      svgEl('circle', { cx: tx, cy: ty, r: rr, fill: 'rgba(22,209,106,.18)', stroke: '#fff', 'stroke-width': 7, 'stroke-opacity': .9 }, gTol);
      const ring = { cx: tx, cy: ty, r: rr, fill: 'none', stroke: '#0ea855', 'stroke-width': 3.5 };
      if (!A.correct) ring['stroke-dasharray'] = '9 6';
      svgEl('circle', ring, gTol);
      extra.push({ x: tx - rr - 4, y: ty - rr - 4, w: rr * 2 + 8, h: rr * 2 + 8 });
      if (A.click) {
        const cx = A.click.x * W, cy = A.click.y * H;
        if (!A.correct) {
          svgEl('line', { x1: cx, y1: cy, x2: tx, y2: ty, stroke: '#fff', 'stroke-width': 7, 'stroke-opacity': .85, 'stroke-linecap': 'round' }, gTol);
          svgEl('line', { x1: cx, y1: cy, x2: tx, y2: ty, stroke: '#e5173c', 'stroke-width': 3.2, 'stroke-dasharray': '9 6', 'stroke-linecap': 'round' }, gTol);
        }
        extra.push({ x: cx - 18, y: cy - 18, w: 36, h: 36 });
      }
    }

    const items = list.map(l => ({
      x: l.it.ax * W, y: l.it.ay * H,
      text: (l.big ? fullName(l.it) : l.it.name),
      color: l.color, big: !!l.big,
      noText: !names && !l.big
    }));
    drawLabels(gLab, W, H, items, extra);

    list.forEach(l => {
      if (l.pulse && !(A && A.target.key === l.it.key)) {
        svgEl('circle', { class: 'pulse-ring', cx: l.it.ax * W, cy: l.it.ay * H, r: 10, fill: 'none', stroke: '#38bdf8', 'stroke-width': 3 }, gMark);
      }
    });
    if (A && A.click) { drawClickMarker(gMark, A.click.x * W, A.click.y * H, A.correct, A.fresh); A.fresh = false; }
  };

  /* ----- timer ----- */
  function paintTimer() {
    const v = Math.max(0, tLeft);
    timerBar.style.width = (v / tTotal * 100) + '%';
    timerNum.textContent = Math.ceil(v) + 's';
    timerWrap.classList.toggle('low', v <= 5);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    timerWrap.style.display = 'none';
    timerWrap.classList.remove('low');
  }
  function startTimer() {
    stopTimer();
    if (!Settings.get('timed') || locked || idx >= order.length || scene.summary) return;
    tTotal = Number(Settings.get('secs')) || 15; tLeft = tTotal;
    timerWrap.style.display = ''; paintTimer();
    let last = performance.now();
    timerId = setInterval(() => {
      const now = performance.now(), dt = (now - last) / 1000; last = now;
      if (document.hidden || root.offsetParent === null) return;   // paused while this tab / the page is hidden
      tLeft -= dt; paintTimer();
      if (tLeft <= 0) { stopTimer(); if (!locked) answer(null, null, true); }
    }, 120);
  }

  /* ----- flow ----- */
  function init(custom) {
    order = custom || getSession();
    idx = 0; locked = false; results = []; streak = 0; bestStreak = 0;
    sid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    scene = { answer: null, showCat: null, sel: null, summary: false };
    totalVal.textContent = order.length;
    qState.style.display = ''; rState.style.display = 'none';
    splitEl.classList.remove('summary');
    showCurrent();
  }

  function showCurrent() {
    scene.answer = null; scene.showCat = null; scene.sel = null;
    pl.setSel(null); pl.setCat(null);
    catTag.classList.remove('on');
    feedback.textContent = ''; feedback.className = 'feedback';
    nextBtn.style.display = 'none'; nextBtn.classList.remove('nudge');
    locked = false; mapFrame.classList.remove('locked');
    shell.classList.remove('hit-state', 'miss-state', 'flash');
    if (idx >= order.length) { finish(); return; }
    const it = order[idx];
    currentAskedName = pickAskedName(it);
    promptName.textContent = currentAskedName;
    catNameEl.textContent = it.categoryLabel || '';
    riverHint.style.display = it.type === 'river' ? '' : 'none';
    scoreVal.textContent = results.filter(r => r.correct).length;
    streakVal.textContent = streak;
    noTrackTag.style.display = Settings.get('track') ? 'none' : '';
    mv.redraw();
    startTimer();
  }

  function answer(fx, fy, timeout) {
    const target = order[idx];
    stopTimer();
    locked = true; mapFrame.classList.add('locked');
    let correct = false, distCm = null;
    if (!timeout) {
      const sz = mv.size();
      const distPx = Math.hypot((fx - target.ax) * sz.W, (fy - target.ay) * sz.H);
      correct = distPx <= (target.tolCm / PAGE_CM) * sz.W;
      distCm = +(distPx / sz.W * PAGE_CM).toFixed(2);
    }
    scene.answer = { target, correct, timeout: !!timeout, click: timeout ? null : { x: fx, y: fy }, fresh: true };

    if (correct) {
      say('✓ නිවැරදියි! (' + distCm.toFixed(2) + ' cm)', 'hit-text');
      streak++; if (streak > bestStreak) bestStreak = streak;
    } else {
      say(timeout ? '✗ කාලය අවසන්! නිවැරදි ස්ථානය පෙන්වා ඇත' : '✗ වැරදියි — නිවැරදි ස්ථානය පෙන්වා ඇත (' + distCm.toFixed(2) + ' cm ඈත)', 'miss-text');
      streak = 0;
    }
    streakVal.textContent = streak;
    shell.classList.remove('hit-state', 'miss-state', 'flash');
    shell.classList.add(correct ? 'hit-state' : 'miss-state');
    if (!correct) { void shell.offsetWidth; shell.classList.add('flash'); }

    results.push({ item: target, key: target.key, name: currentAskedName, categoryLabel: target.categoryLabel, correct, distCm, timeout: !!timeout });
    scoreVal.textContent = results.filter(r => r.correct).length;

    if (Settings.get('track')) {
      Tracker.add({
        t: Date.now(), s: sid, k: target.key, ok: correct ? 1 : 0, d: distCm,
        cx: timeout ? null : +fx.toFixed(4), cy: timeout ? null : +fy.toFixed(4), to: timeout ? 1 : 0
      });
    }

    mv.redraw();
    mv.reveal(scene.answer.click ? [scene.answer.click, { x: target.ax, y: target.ay }] : [{ x: target.ax, y: target.ay }]);
    nextBtn.style.display = '';
    try { nextBtn.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }

  mv.onClick = (fx, fy) => {
    if (idx >= order.length || scene.summary) return;
    if (locked) {
      nextBtn.classList.remove('nudge'); void nextBtn.offsetWidth; nextBtn.classList.add('nudge');
      nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
    answer(fx, fy, false);
  };

  function finish() {
    stopTimer();
    scene = { answer: null, showCat: null, sel: null, summary: true };
    pl.setSel(null); pl.setCat(null);
    shell.classList.remove('hit-state', 'miss-state', 'flash');
    qState.style.display = 'none'; rState.style.display = '';
    splitEl.classList.add('summary');
    const okN = results.filter(r => r.correct).length;
    finalScore.textContent = okN; finalTotal.textContent = order.length;
    const pct = order.length ? Math.round(okN / order.length * 100) : 0;
    rMeta.innerHTML = '<span>නිවැරදි: <b>' + pct + '%</b></span><span>දීර්ඝතම අඛණ්ඩ නිවැරදි: <b>' + bestStreak + '</b></span>';
    rNote.textContent = 'සිතියමේ සියලු ස්ථාන පෙන්වා ඇත — කොළ: නිවැරදි, රතු: වැරදි. පහත ස්ථානයක් ක්ලික් කර සිතියමේ බලන්න.';
    reviewList.innerHTML = '';
    results.forEach(r => {
      const li = document.createElement('li');
      li.className = r.correct ? 'ok' : 'bad';
      li.dataset.key = r.key;
      li.innerHTML = '<span class="rname">' + esc(r.name) + '<span class="rcat">' + esc(r.categoryLabel || '') + '</span></span>' +
        '<span class="mark">' + (r.correct ? '✓ ' : '✗ ') + (r.timeout ? 'කාලය අවසන්' : r.distCm.toFixed(2) + 'cm') + '</span>';
      reviewList.appendChild(li);
    });
    mistakesBtn.style.display = results.some(r => !r.correct) ? '' : 'none';
    exitBtn.style.display = opts.onExit ? '' : 'none';
    q('.col-quiz').scrollTop = 0;
    mv.redraw();
    if (!window.matchMedia('(min-width: 880px)').matches) rState.scrollIntoView({ behavior: 'smooth', block: 'nearest' });   // stacked (phone) layout only
  }

  reviewList.addEventListener('click', e => { const li = e.target.closest('li'); if (li) pickPlace(li.dataset.key); });
  nextBtn.addEventListener('click', () => { if (!locked) return; idx++; showCurrent(); });
  restartBtn.addEventListener('click', () => init());
  mistakesBtn.addEventListener('click', () => { init(shuffle(results.filter(r => !r.correct).map(r => r.item))); });
  exitBtn.addEventListener('click', () => { if (opts.onExit) opts.onExit(); });

  cleanups.push(Bus.on('settings', k => {
    if (k === 'track') noTrackTag.style.display = Settings.get('track') ? 'none' : '';
    if (k === 'secs' && timerId) startTimer();
    if (k === 'timed') { if (!Settings.get('timed')) stopTimer(); else if (!locked && !scene.summary) startTimer(); }
  }));

  init();
  return {
    init,
    destroy() { stopTimer(); cleanups.forEach(f => f()); mv.destroy(); pl.destroy(); }
  };
}

/* ===================== analytics tab ===================== */
function heat(rate) { return 'hsl(' + Math.round(120 * (1 - rate)) + ',85%,45%)'; }

function progressChart(sessions) {
  const pts = sessions.filter(s => s.n >= 3).slice(-20);
  if (pts.length < 2) return '<div class="an-muted">ප්‍රගති ප්‍රස්තාරය සඳහා අවම වශයෙන් පරීක්ෂණ 2ක් (ප්‍රශ්න 3+ බැගින්) අවශ්‍යයි.</div>';
  const W = 340, H = 130, L = 34, R = 8, T = 10, B = 20;
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (1 - v) * (H - T - B);
  const fd = t => new Date(t).toLocaleDateString();
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="පරීක්ෂණ අනුව නිවැරදි ප්‍රතිශතය">';
  [0, 0.5, 1].forEach(v => {
    s += '<line class="gridl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
      '<text class="ax" x="' + (L - 5) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + (v * 100) + '%</text>';
  });
  s += '<polyline fill="none" stroke="#e0ab4c" stroke-width="2.5" stroke-linejoin="round" points="' + pts.map((p, i) => x(i) + ',' + y(p.ok / p.n)).join(' ') + '"/>';
  pts.forEach((p, i) => {
    const a = p.ok / p.n;
    s += '<circle cx="' + x(i) + '" cy="' + y(a) + '" r="4.5" fill="' + (a < 0.5 ? '#ff3b5c' : '#16d16a') + '" stroke="#14181d" stroke-width="1.5"><title>' + fd(p.t) + ' — ' + Math.round(a * 100) + '% (' + p.ok + '/' + p.n + ')</title></circle>';
  });
  s += '<text class="ax" x="' + L + '" y="' + (H - 5) + '">' + fd(pts[0].t) + '</text><text class="ax" x="' + (W - R) + '" y="' + (H - 5) + '" text-anchor="end">' + fd(pts[pts.length - 1].t) + '</text></svg>';
  return s;
}

function buildAnalytics(root, hooks) {
  root.innerHTML = '<div class="split two"><div class="col-quiz"><div class="panel-box an-box"></div></div><div class="col-map"></div></div>' +
    '<input type="file" class="an-file" accept=".json,application/json" hidden>';
  const box = root.querySelector('.an-box'), fileIn = root.querySelector('.an-file');
  const mv = createMapView(root.querySelector('.col-map'));
  let focus = null, msg = '', resetArmed = false, resetTimer = null;

  const focusKeys = () => !focus ? null : focus.type === 'cat' ? POOL_BY_CAT[focus.id].map(o => o.key) : focus.keys;

  mv.painter = (svg, W, H) => {
    const st = Stats.get(), fk = focusKeys();
    const gRiv = svgEl('g', null, svg), gDots = svgEl('g', null, svg), gLab = svgEl('g', null, svg);
    // heat dots: size and colour follow how often a place is missed (grey = never asked)
    const rate = it => { const s = st.byKey[it.key]; return s ? s.miss / s.att : -1; };
    ALL.slice().sort((a, b) => rate(a) - rate(b)).forEach(it => {
      const s = st.byKey[it.key], x = it.ax * W, y = it.ay * H;
      const rt = s ? s.miss / s.att : 0;
      const r = s ? 5 + 7 * rt : 3.5;
      svgEl('circle', { cx: x, cy: y, r: r + 1.8, fill: '#fff', 'fill-opacity': .9 }, gDots);
      svgEl('circle', { cx: x, cy: y, r, fill: s ? heat(rt) : '#8d97a3', stroke: '#14181d', 'stroke-opacity': .5, 'stroke-width': 1 }, gDots);
    });
    let keys, mode;
    if (fk) { keys = fk; mode = focus.type; }
    else { keys = st.weakList.slice(0, 8).map(w => w.key); mode = 'weak'; }
    const items = [];
    keys.forEach((k, i) => {
      const it = BY_KEY[k]; if (!it) return;
      if (it.type === 'river' && fk) drawRiver(gRiv, it, W, H, '#ff9f1a');
      const s = st.byKey[k];
      const pct = s ? Math.round(s.miss / s.att * 100) : null;
      let color = 'neutral', big = false;
      if (mode === 'weak') color = 'miss';
      else if (mode === 'keys') { color = (focus.colors && focus.colors[i]) || 'sel'; big = true; }
      items.push({ x: it.ax * W, y: it.ay * H, text: it.name + (pct != null ? '  ' + pct + '%' : ''), color, big, fill: s ? heat(s.miss / s.att) : null });
    });
    drawLabels(gLab, W, H, items, []);
    if (mode === 'keys') {
      items.forEach(it => svgEl('circle', { class: 'pulse-ring', cx: it.x, cy: it.y, r: 10, fill: 'none', stroke: '#38bdf8', 'stroke-width': 3 }, gLab));
    }
  };

  function focusLabel() {
    if (!focus) return '';
    if (focus.type === 'cat') return CAT_LABEL(focus.id);
    return focus.keys.map(k => BY_KEY[k].name).join(' ↔ ');
  }
  function CAT_LABEL(id) { const c = CATEGORIES.find(x => x.id === id); return c ? c.label : id; }

  function render() {
    const st = Stats.get();
    let h = '<div class="an-title">ඔබේ දත්ත විශ්ලේෂණය</div>';
    if (!Settings.get('track')) h += '<div class="an-note warn">දත්ත සටහන් කිරීම දැනට අක්‍රීයයි — අලුත් පිළිතුරු සටහන් නොවේ.</div>';
    if (!storageOK) h += '<div class="an-note warn">මෙම බ්‍රවුසරයේ දත්ත සුරැකිය නොහැක. මෙම පිටුව වසන තුරු පමණක් දත්ත රැඳේ.</div>';
    if (msg) h += '<div class="an-note ok">' + esc(msg) + '</div>';
    if (focus) h += '<button type="button" class="an-focus" data-act="clear">සිතියමේ පෙන්වන්නේ: ' + esc(focusLabel()) + ' ✕</button>';

    if (!st.att) {
      h += '<div class="an-note">තවම දත්ත නැත. ඉහත “දත්ත සටහන් කිරීම” සක්‍රීය කර, පුහුණු tab එකක ප්‍රශ්න කිහිපයක් පිළිතුරු දෙන්න — ඉන්පසු ඔබ වැඩිපුර වැරදෙන ස්ථාන මෙහි පෙනේ.</div>';
    } else {
      const acc = Math.round(st.ok / st.att * 100);
      const cnt = { 'lv-new': 0, 'lv-learning': 0, 'lv-weak': 0, 'lv-mastered': 0 };
      ALL.forEach(it => { cnt[levelInfo(it.key).cls]++; });
      h += '<div class="an-tiles">' +
        '<div class="tile"><b>' + st.att + '</b><span>පිළිතුරු</span></div>' +
        '<div class="tile"><b>' + acc + '%</b><span>නිවැරදි</span></div>' +
        '<div class="tile"><b>' + (st.avgD == null ? '—' : st.avgD.toFixed(2)) + '</b><span>සාමාන්‍ය දුර (cm)</span></div>' +
        '<div class="tile"><b>' + st.masteredCount + '/' + ALL.length + '</b><span>ප්‍රගුණ කළ ස්ථාන</span></div></div>' +
        '<div class="lv-row"><span><i class="dot lv-new"></i>අලුත් <b>' + cnt['lv-new'] + '</b></span><span><i class="dot lv-learning"></i>ඉගෙනගන්නා <b>' + cnt['lv-learning'] + '</b></span>' +
        '<span><i class="dot lv-weak"></i>දුර්වල <b>' + cnt['lv-weak'] + '</b></span><span><i class="dot lv-mastered"></i>ප්‍රගුණයි <b>' + cnt['lv-mastered'] + '</b></span></div>' +
        '<div class="heat-legend"><span>සිතියම: නිවැරදි</span><i></i><span>වැරදි</span><span>(අළු = තවම නැත)</span></div>' +
        '<button type="button" class="act-btn primary" data-act="practice"' + (st.weakList.length ? '' : ' disabled') + '>දුර්වල ස්ථාන පුහුණුව ආරම්භ කරන්න</button>';

      // categories, weakest first
      const cats = CATEGORIES.filter(catHasData).map(c => { const s = st.byCat[c.id]; return { c, s, acc: s ? 1 - s.miss / s.att : null }; });
      cats.sort((a, b) => (a.acc == null ? 1 : 0) - (b.acc == null ? 1 : 0) || (a.acc || 0) - (b.acc || 0));
      h += '<div class="an-sec"><h3>ප්‍රවර්ග අනුව</h3>' + cats.map(o => {
        const p = o.s ? Math.round(o.acc * 100) : null;
        return '<button type="button" class="bar-row' + (focus && focus.type === 'cat' && focus.id === o.c.id ? ' on' : '') + '" data-act="cat" data-id="' + esc(o.c.id) + '">' +
          '<span>' + esc(o.c.label) + '</span><span class="bt' + (o.s ? '' : ' none') + '"><i style="width:' + (p || 0) + '%"></i></span>' +
          '<span class="bp">' + (o.s ? p + '%' : '—') + '<small>' + (o.s ? o.s.att : 0) + '</small></span></button>';
      }).join('') + '</div>';

      // most-missed places
      h += '<div class="an-sec"><h3>වැඩිපුරම වැරදෙන ස්ථාන</h3>';
      if (!st.weakList.length) h += '<div class="an-muted">වැරදි පිළිතුරු නැත (හෝ සියල්ල දැන් ප්‍රගුණයි) — නියමයි!</div>';
      st.weakList.slice(0, 10).forEach(s => {
        const it = BY_KEY[s.key], li = levelInfo(s.key);
        h += '<button type="button" class="wk-row" data-act="place" data-key="' + esc(s.key) + '"><i class="dot ' + li.cls + '" title="' + li.label + '"></i>' +
          '<span class="wn">' + esc(it.name) + '<small>' + esc(it.categoryLabel) + '</small></span>' +
          '<span class="wp">' + Math.round(s.miss / s.att * 100) + '%<small>' + s.miss + '/' + s.att + ' වැරදි</small></span></button>';
      });
      h += '</div>';

      // confusions
      h += '<div class="an-sec"><h3>ඔබ පටලවා ගන්නා ස්ථාන</h3>';
      if (!st.confusions.length) h += '<div class="an-muted">තවම පැහැදිලි රටාවක් නැත (එකම පටලැවිල්ල 2 වතාවක්වත් වූ විට මෙහි පෙන්වයි).</div>';
      st.confusions.forEach(c => {
        h += '<button type="button" class="cf-row" data-act="conf" data-from="' + esc(c.from) + '" data-to="' + esc(c.to) + '"><span><b>' + esc(BY_KEY[c.from].name) +
          '</b> සෙවීමේදී <b>' + esc(BY_KEY[c.to].name) + '</b> ළඟ ක්ලික් කළා</span><em>' + c.n + '×</em></button>';
      });
      h += '</div>';

      h += '<div class="an-sec"><h3>පරීක්ෂණ අනුව නිවැරදි ප්‍රතිශතය</h3>' + progressChart(st.sessions) + '</div>';
    }

    h += '<div class="an-sec"><h3>දත්ත කළමනාකරණය</h3><div class="data-tools">' +
      '<button type="button" class="act-btn" data-act="export"' + (st.att ? '' : ' disabled') + '>අපනයනය (JSON)</button>' +
      '<button type="button" class="act-btn" data-act="import">ආනයනය</button>' +
      '<button type="button" class="act-btn danger' + (resetArmed ? ' armed' : '') + '" data-act="reset"' + (st.att ? '' : ' disabled') + '>' + (resetArmed ? 'ස්ථිරද? නැවත ක්ලික් කරන්න' : 'සියල්ල මකන්න') + '</button>' +
      '</div></div>';
    box.innerHTML = h;
  }
  function refresh() { render(); mv.redraw(); }

  box.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act !== 'export' && act !== 'import' && act !== 'reset') msg = '';
    if (act !== 'reset' && resetArmed) { resetArmed = false; clearTimeout(resetTimer); }
    if (act === 'cat') focus = (focus && focus.type === 'cat' && focus.id === b.dataset.id) ? null : { type: 'cat', id: b.dataset.id };
    else if (act === 'place') {
      focus = { type: 'keys', keys: [b.dataset.key] };
      refresh(); const it = BY_KEY[b.dataset.key]; mv.reveal([{ x: it.ax, y: it.ay }]); return;
    }
    else if (act === 'conf') focus = { type: 'keys', keys: [b.dataset.from, b.dataset.to], colors: ['sel', 'miss'] };
    else if (act === 'clear') focus = null;
    else if (act === 'practice') { hooks.onPractice(); return; }
    else if (act === 'export') {
      const url = URL.createObjectURL(new Blob([Tracker.exportText()], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = 'sri-lanka-quiz-data-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      msg = 'දත්ත අපනයනය කළා';
    }
    else if (act === 'import') { fileIn.click(); return; }
    else if (act === 'reset') {
      if (!resetArmed) {
        resetArmed = true; clearTimeout(resetTimer);
        resetTimer = setTimeout(() => { resetArmed = false; render(); }, 4000);
      } else {
        resetArmed = false; clearTimeout(resetTimer);
        Tracker.clear(); focus = null; msg = 'සියලු දත්ත මකා දැමුවා';
        return;   // Tracker.clear() emits 'tracker', which refreshes this view
      }
    }
    refresh();
  });
  fileIn.addEventListener('change', () => {
    const f = fileIn.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { const r = Tracker.importText(String(rd.result)); msg = 'සටහන් ' + r.added + ' ක් ආනයනය කළා'; }
      catch (err) { msg = 'ගොනුව වලංගු නැත'; }
      fileIn.value = ''; refresh();
    };
    rd.readAsText(f);
  });

  Bus.on('tracker', () => { if (root.offsetParent !== null) refresh(); });
  Bus.on('settings', k => { if (k === 'track' && root.offsetParent !== null) render(); });
  render();
  return { refresh };
}

/* ===================== page wiring ===================== */
document.addEventListener('DOMContentLoaded', () => {
  const tabsRow = document.getElementById('tabsRow');
  const panelsRoot = document.getElementById('panelsRoot');
  const emptyState = document.getElementById('emptyState');
  const dataCats = CATEGORIES.filter(catHasData);

  /* ----- toolbar ----- */
  const swTrack = document.getElementById('swTrack'), stTrack = document.getElementById('stTrack'), chipTrack = document.getElementById('chipTrack');
  const swTimed = document.getElementById('swTimed'), selSecs = document.getElementById('selSecs');
  const swNames = document.getElementById('swNames'), segView = document.getElementById('segView');
  function syncToolbar() {
    swTrack.checked = Settings.get('track');
    stTrack.textContent = swTrack.checked ? 'සක්‍රීය' : 'අක්‍රීය';
    chipTrack.classList.toggle('off', !swTrack.checked);
    swTimed.checked = Settings.get('timed');
    selSecs.value = String(Settings.get('secs')); selSecs.disabled = !swTimed.checked;
    swNames.checked = Settings.get('names');
    segView.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.view === Settings.get('view')));
    document.body.classList.toggle('view-fit', Settings.get('view') === 'fit');
  }
  swTrack.addEventListener('change', () => Settings.set('track', swTrack.checked));
  swTimed.addEventListener('change', () => Settings.set('timed', swTimed.checked));
  selSecs.addEventListener('change', () => Settings.set('secs', Number(selSecs.value)));
  swNames.addEventListener('change', () => Settings.set('names', swNames.checked));
  segView.addEventListener('click', e => { const b = e.target.closest('button'); if (b) Settings.set('view', b.dataset.view); });
  Bus.on('settings', syncToolbar);
  syncToolbar();

  // the quiz area always fills the rest of the screen below the header
  function fitHeights() {
    const top = panelsRoot.getBoundingClientRect().top + window.scrollY;
    document.documentElement.style.setProperty('--split-h', Math.max(480, window.innerHeight - top - 16) + 'px');
  }
  window.addEventListener('resize', fitHeights);
  if (window.ResizeObserver) new ResizeObserver(fitHeights).observe(document.getElementById('topbar'));

  /* ----- tabs / panels ----- */
  function makeTab(id, label, extraClass) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (extraClass ? ' ' + extraClass : '');
    btn.dataset.panel = id; btn.textContent = label;
    tabsRow.appendChild(btn);
    return btn;
  }
  function makePanel(id) {
    const div = document.createElement('div');
    div.className = 'panel'; div.id = id;
    panelsRoot.appendChild(div);
    return div;
  }

  dataCats.forEach(cat => {
    const panelId = 'panel_' + cat.id;
    makeTab(panelId, cat.label);
    buildQuizEngine(makePanel(panelId), () => sessionFromCategory(cat));
  });

  /* ----- question generator ----- */
  const genPanelId = 'panel_gen';
  makeTab(genPanelId, 'ප්‍රශ්න උත්පාදකය', 'generator');
  const genPanel = makePanel(genPanelId);
  const setupDiv = document.createElement('div');
  setupDiv.className = 'panel-box gen-setup';
  setupDiv.innerHTML =
    '<p>පසුගිය අවුරුදු 10ක විභාග රටාව අනුව, ප්‍රවර්ග අහඹු ලෙස තෝරාගෙන ප්‍රශ්න උත්පාදනය කරයි. 0.2cm ට වඩා ආසන්න ස්ථාන දෙකක් එකම පරීක්ෂණයේ එකට නොඑයි.</p>' +
    '<label for="qCount">ප්‍රශ්න ගණන:</label>' +
    '<input type="number" id="qCount" value="12" min="6" max="24">' +
    '<div class="gen-btns">' +
      '<button class="gen-start-btn" id="genStartBtn">පරීක්ෂණය ආරම්භ කරන්න</button>' +
      '<button class="gen-start-btn weak" id="genWeakBtn" title="ඔබ වැඩිපුර වැරදෙන ස්ථාන වැඩිපුර ඇසේ">දුර්වල ස්ථාන පුහුණුව</button>' +
    '</div>' +
    '<div class="gen-note" id="genWeakNote"></div>' +
    '<div class="gen-note" id="genNote"></div>';
  genPanel.appendChild(setupDiv);

  const genNote = setupDiv.querySelector('#genNote'), genWeakNote = setupDiv.querySelector('#genWeakNote');
  const genWeakBtn = setupDiv.querySelector('#genWeakBtn');
  genNote.textContent = dataCats.length
    ? 'දැනට ක්‍රියාත්මක ප්‍රවර්ග: ' + dataCats.map(c => c.label).join(', ') + '. ඉතිරි ප්‍රවර්ග ඛණ්ඩාංක ලැබුණු පසු ස්වයංක්‍රීයව එකතු වේ.'
    : 'තවම කිසිදු ප්‍රවර්ගයක් සඳහා ඛණ්ඩාංක නොමැත. කරුණාකර පළමුව calibrator එක සම්පූර්ණ කරන්න.';

  function updateGenWeakState() {
    const n = Stats.get().weakList.length;
    genWeakBtn.disabled = !n || !dataCats.length;
    genWeakNote.textContent = n
      ? 'දුර්වල ස්ථාන ' + n + ' ක් සටහන් වී ඇත — පුහුණුවේදී ඒවා වැඩිපුර ඇසේ.'
      : 'දුර්වල ස්ථාන පුහුණුව සඳහා පළමුව “දත්ත සටහන් කිරීම” සක්‍රීය කර ප්‍රශ්න පිළිතුරු දෙන්න.';
  }
  Bus.on('tracker', updateGenWeakState);
  updateGenWeakState();

  const genQuizHost = document.createElement('div');
  genQuizHost.style.display = 'none';
  genPanel.appendChild(genQuizHost);
  let genEngine = null;
  function startGen(kind) {
    if (!dataCats.length) return;
    const n = Math.max(6, Math.min(24, parseInt(document.getElementById('qCount').value, 10) || 12));
    setupDiv.style.display = 'none';

    genEngine = buildQuizEngine(genQuizHost, kind === 'weak' ? () => weakSession(n) : () => generateSession(n), {
      onExit() {
        genEngine.destroy(); genEngine = null;
        genQuizHost.innerHTML = ''; genQuizHost.style.display = 'none';
        setupDiv.style.display = ''; updateGenWeakState();

    fitHeights();
  }
  document.getElementById('genStartBtn').addEventListener('click', () => startGen('normal'));
  genWeakBtn.addEventListener('click', () => startGen('weak'));

  /* ----- analytics ----- */
  const anPanelId = 'panel_analytics';
  makeTab(anPanelId, 'විශ්ලේෂණය', 'analytics');
  const analytics = buildAnalytics(makePanel(anPanelId), { onPractice() { activate(genPanelId); startGen('weak'); } });

  function activate(panelId) {
    tabsRow.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.panel === panelId));
    panelsRoot.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === panelId));
    const ab = tabsRow.querySelector('.tab-btn.active');
    if (ab && tabsRow.scrollWidth > tabsRow.clientWidth) tabsRow.scrollTo({ left: ab.offsetLeft - tabsRow.clientWidth / 2 + ab.offsetWidth / 2, behavior: 'smooth' });
    fitHeights();
    if (panelId === anPanelId) analytics.refresh();
    if (panelId === genPanelId) updateGenWeakState();
  }
  tabsRow.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => activate(btn.dataset.panel)));

  if (dataCats.length) {
    activate('panel_' + dataCats[0].id);
  } else {
    emptyState.style.display = '';
    emptyState.innerHTML = 'තවම කිසිදු ප්‍රවර්ගයක් සඳහා ඛණ්ඩාංක නොමැත. <b>calibrator</b> එකෙන් ලැබෙන දත්ත මෙතනට එකතු කළ පසු, පුහුණු tabs සහ ප්‍රශ්න උත්පාදකය ක්‍රියාත්මක වේ. පහතින් ප්‍රශ්න උත්පාදකය බැලිය හැක.';
    activate(genPanelId);
  }

  /* ----- reference list (unchanged) ----- */
  const refRoot = document.getElementById('refRoot');
  Object.keys(REFERENCE).forEach(catLabel => {
    const items = REFERENCE[catLabel];
    const cat = CATEGORIES.find(c => c.label === catLabel);
    const pending = cat && !catHasData(cat);
    const block = document.createElement('div');
    block.className = 'ref-cat';
    const h3 = document.createElement('h3');
    h3.innerHTML = catLabel + (pending ? ' <span class="pending">(ඛණ්ඩාංක එනතුරු පොරොත්තුවෙන්)</span>' : '');
    block.appendChild(h3);
    const ul = document.createElement('ul');
    items.forEach(([name, alt]) => {
      const li = document.createElement('li');
      li.innerHTML = name + (alt ? ' <span class="alt">(' + alt + ')</span>' : '');
      ul.appendChild(li);
    });
    block.appendChild(ul);
    refRoot.appendChild(block);
  });

  fitHeights();
});
</script>
</body>
</html>
